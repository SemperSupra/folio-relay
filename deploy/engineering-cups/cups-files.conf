User foliorelay
Group foliorelay
ServerRoot /etc/cups
StateDir /var/lib/cups
ServerBin /usr/lib/cups
ServerKeychain /var/lib/cups/ssl
CreateSelfSignedCerts Yes
CacheDir /var/cache/cups
DataDir /usr/share/cups
RequestRoot /var/spool/cups
TempDir /var/spool/cups/tmp
AccessLog /var/log/cups/access_log
ErrorLog /var/log/cups/error_log
PageLog /var/log/cups/page_log
FileDevice No
PassEnv FOLIORELAY_INGEST_BIN
PassEnv FOLIORELAY_STATE_URL
PassEnv FOLIORELAY_INGRESS_STORE
PassEnv FOLIORELAY_MAX_INGRESS_BYTES
PassEnv FOLIORELAY_SUBSTRATE_INSTANCE
