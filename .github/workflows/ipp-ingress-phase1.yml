name: IPP Ingress Phase 1

on:
  pull_request:
    paths:
      - 'cmd/foliorelay-ipp-ingest/**'
      - 'cmd/foliorelay-state-fixture/**'
      - 'internal/state/**'
      - '.github/workflows/ipp-ingress-phase1.yml'
  push:
    branches: [main]
    paths:
      - 'cmd/foliorelay-ipp-ingest/**'
      - 'cmd/foliorelay-state-fixture/**'
      - 'internal/state/**'
      - '.github/workflows/ipp-ingress-phase1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ippeveprinter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout FolioRelay
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Build FolioRelay ingress components
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/foliorelay-ipp-ingest ./internal/state
          mkdir -p "$RUNNER_TEMP/bin"
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/bin/foliorelay-state-fixture" ./cmd/foliorelay-state-fixture
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/bin/foliorelay-ipp-ingest" ./cmd/foliorelay-ipp-ingest
          file "$RUNNER_TEMP/bin/"*

      - name: Build pinned ippeveprinter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf build-essential pkg-config git ca-certificates curl \
            libssl-dev zlib1g-dev libcups2-dev cups-client cups-ipp-utils
          git clone --depth 1 --branch v2.4.19 https://github.com/OpenPrinting/cups.git "$RUNNER_TEMP/cups"
          cd "$RUNNER_TEMP/cups"
          ./configure \
            --prefix=/usr \
            --with-tls=openssl \
            --with-dnssd=no \
            --disable-pam \
            --disable-gssapi \
            --disable-libusb \
            --disable-webif \
            --disable-browsing \
            --disable-default-shared \
            --disable-raw-printing \
            --with-languages=none
          make -C cups -j"$(nproc)"
          make -C tools -j"$(nproc)" ippeveprinter-static

      - name: Start state authority fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/ingress" "$RUNNER_TEMP/state"
          "$RUNNER_TEMP/bin/foliorelay-state-fixture" -listen 127.0.0.1:18080 \
            -journal "$RUNNER_TEMP/state/journal.frj" \
            >"$RUNNER_TEMP/evidence/state-fixture.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/evidence/state.pid"
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:18080/health; then
              exit 0
            fi
            sleep 1
          done
          echo "state fixture did not become ready" >&2
          exit 1

      - name: Start IPP ingress
        shell: bash
        env:
          FOLIORELAY_STATE_URL: http://127.0.0.1:18080
          FOLIORELAY_INGRESS_STORE: ${{ runner.temp }}/ingress
          FOLIORELAY_MAX_INGRESS_BYTES: "104857600"
          FOLIORELAY_SUBSTRATE_INSTANCE: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ippeve-spool"
          "$RUNNER_TEMP/cups/tools/ippeveprinter-static" \
            -r off \
            -p 8632 \
            -d "$RUNNER_TEMP/ippeve-spool" \
            -k \
            -f application/pdf,image/pwg-raster \
            -c "$RUNNER_TEMP/bin/foliorelay-ipp-ingest" \
            "FolioRelay Phase1" \
            >"$RUNNER_TEMP/evidence/ippeveprinter.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/evidence/ippeve.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8632/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "ippeveprinter did not become ready" >&2
          cat "$RUNNER_TEMP/evidence/ippeveprinter.log" >&2 || true
          exit 1

      - name: Submit real PDF job and verify immutable artifact handoff
        shell: bash
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/sample.pdf" <<'PDF'
          %PDF-1.1
          1 0 obj
          << /Type /Catalog /Pages 2 0 R >>
          endobj
          2 0 obj
          << /Type /Pages /Kids [3 0 R] /Count 1 >>
          endobj
          3 0 obj
          << /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] >>
          endobj
          trailer
          << /Root 1 0 R >>
          %%EOF
          PDF

          ipptool -tv -f "$RUNNER_TEMP/sample.pdf" \
            ipp://127.0.0.1:8632/ipp/print \
            "$RUNNER_TEMP/cups/examples/print-job.test" \
            | tee "$RUNNER_TEMP/evidence/print-job.txt"

          for i in $(seq 1 30); do
            accepted="$(curl -fsS http://127.0.0.1:18080/v1/stats | python3 -c 'import json,sys; print(json.load(sys.stdin)["accepted"])')"
            if [ "$accepted" -ge 1 ]; then
              break
            fi
            sleep 1
          done

          expected="$(sha256sum "$RUNNER_TEMP/sample.pdf" | awk '{print $1}')"
          object="$RUNNER_TEMP/ingress/sha256/${expected:0:2}/$expected"
          test -f "$object"
          cmp "$RUNNER_TEMP/sample.pdf" "$object"
          printf '{"sha256":"%s","object":"%s"}\n' "$expected" "$object" \
            >"$RUNNER_TEMP/evidence/artifact.json"

      - name: Prove adapter replay and conflict behavior
        shell: bash
        env:
          CONTENT_TYPE: application/pdf
          IPP_JOB_ID: "9001"
          FOLIORELAY_STATE_URL: http://127.0.0.1:18080
          FOLIORELAY_INGRESS_STORE: ${{ runner.temp }}/ingress
          FOLIORELAY_SUBSTRATE_INSTANCE: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bin/foliorelay-ipp-ingest" "$RUNNER_TEMP/sample.pdf" \
            2>>"$RUNNER_TEMP/evidence/adapter.log"
          "$RUNNER_TEMP/bin/foliorelay-ipp-ingest" "$RUNNER_TEMP/sample.pdf" \
            2>>"$RUNNER_TEMP/evidence/adapter.log"

          cp "$RUNNER_TEMP/sample.pdf" "$RUNNER_TEMP/conflict.pdf"
          printf '\n%% conflicting bytes\n' >>"$RUNNER_TEMP/conflict.pdf"
          if "$RUNNER_TEMP/bin/foliorelay-ipp-ingest" "$RUNNER_TEMP/conflict.pdf" \
              2>>"$RUNNER_TEMP/evidence/adapter.log"; then
            echo "conflicting idempotency replay unexpectedly succeeded" >&2
            exit 1
          fi

          curl -fsS http://127.0.0.1:18080/v1/stats \
            | tee "$RUNNER_TEMP/evidence/stats.json"
          python3 - "$RUNNER_TEMP/evidence/stats.json" <<'PY'
          import json, pathlib, sys
          stats = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert stats["accepted"] == 2, stats
          assert stats["replayed"] == 1, stats
          assert stats["conflicts"] == 1, stats
          PY

      - name: Prove state-authority restart preserves idempotency
        shell: bash
        env:
          CONTENT_TYPE: application/pdf
          IPP_JOB_ID: "9001"
          FOLIORELAY_STATE_URL: http://127.0.0.1:18080
          FOLIORELAY_INGRESS_STORE: ${{ runner.temp }}/ingress
          FOLIORELAY_SUBSTRATE_INSTANCE: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          kill "$(cat "$RUNNER_TEMP/evidence/state.pid")"
          wait "$(cat "$RUNNER_TEMP/evidence/state.pid")" || true

          "$RUNNER_TEMP/bin/foliorelay-state-fixture" -listen 127.0.0.1:18080 \
            -journal "$RUNNER_TEMP/state/journal.frj" \
            >>"$RUNNER_TEMP/evidence/state-fixture.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/evidence/state.pid"

          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:18080/health; then
              break
            fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:18080/health

          "$RUNNER_TEMP/bin/foliorelay-ipp-ingest" "$RUNNER_TEMP/sample.pdf" \
            2>>"$RUNNER_TEMP/evidence/adapter.log"

          curl -fsS http://127.0.0.1:18080/v1/stats \
            | tee "$RUNNER_TEMP/evidence/post-restart-stats.json"
          python3 - "$RUNNER_TEMP/evidence/post-restart-stats.json" <<'PY'
          import json, pathlib, sys
          stats = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert stats["accepted"] == 0, stats
          assert stats["replayed"] == 1, stats
          assert stats["conflicts"] == 0, stats
          PY

      - name: Verify no parser responsibilities leaked into adapter
        shell: bash
        run: |
          set -euo pipefail
          # Adapter is deliberately content-opaque: the Go binary has no CUPS,
          # PDF, PostScript, image, archive, or renderer dependency.
          ldd "$RUNNER_TEMP/bin/foliorelay-ipp-ingest" >"$RUNNER_TEMP/evidence/adapter-ldd.txt" 2>&1 || true
          file "$RUNNER_TEMP/bin/foliorelay-ipp-ingest" | tee "$RUNNER_TEMP/evidence/adapter-file.txt"
          ! grep -Eiq 'libcups|ghostscript|poppler|mupdf|libjpeg|libpng' "$RUNNER_TEMP/evidence/adapter-ldd.txt"

      - name: Stop fixtures
        if: always()
        shell: bash
        run: |
          for name in ippeve state; do
            if [ -f "$RUNNER_TEMP/evidence/$name.pid" ]; then
              kill "$(cat "$RUNNER_TEMP/evidence/$name.pid")" 2>/dev/null || true
            fi
          done

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ipp-ingress-phase1-ippeveprinter
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 14
