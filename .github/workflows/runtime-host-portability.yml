name: Runtime Host Portability

on:
  pull_request:
    paths:
      - 'cmd/foliorelay-ipp-ingest/**'
      - 'cmd/foliorelay-state-fixture/**'
      - 'internal/state/**'
      - 'internal/security/**'
      - 'experiments/print-substrate/**'
      - 'deploy/engineering-cups/**'
      - 'deploy/engineering-pappl/**'
      - 'scripts/make-probe-pdf.py'
      - 'scripts/runtime-host-portability.sh'
      - '.github/workflows/runtime-host-portability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-bundle:
    name: build ${{ matrix.candidate }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            candidate: cups
            service: cups
            compose: deploy/engineering-cups/compose.yaml
          - runner: ubuntu-24.04
            arch: amd64
            candidate: pappl
            service: pappl
            compose: deploy/engineering-pappl/compose.yaml
          - runner: ubuntu-24.04-arm
            arch: arm64
            candidate: cups
            service: cups
            compose: deploy/engineering-cups/compose.yaml
          - runner: ubuntu-24.04-arm
            arch: arm64
            candidate: pappl
            service: pappl
            compose: deploy/engineering-pappl/compose.yaml
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Checkout FolioRelay
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build one native candidate bundle
        shell: bash
        env:
          COMPOSE_PROJECT_NAME: foliorelay-portability
        run: |
          set -euo pipefail
          built=false
          for attempt in 1 2 3; do
            if docker compose -f "${{ matrix.compose }}" build state "${{ matrix.service }}"; then
              built=true
              break
            fi
            echo "native bundle build attempt $attempt failed; retaining successful layers and retrying" >&2
            sleep $((attempt * 30))
          done
          test "$built" = "true"

          state_image="foliorelay-portability-state"
          candidate_image="foliorelay-portability-${{ matrix.service }}"
          test "$(docker image inspect -f '{{.Architecture}}' "$state_image")" = "${{ matrix.arch }}"
          test "$(docker image inspect -f '{{.Architecture}}' "$candidate_image")" = "${{ matrix.arch }}"

          mkdir -p "$RUNNER_TEMP/portability-bundle"
          docker image inspect "$state_image" "$candidate_image" \
            >"$RUNNER_TEMP/portability-bundle/image-inspect.json"
          docker save "$state_image" "$candidate_image" \
            | gzip -1 >"$RUNNER_TEMP/portability-bundle/images.tar.gz"
          sha256sum "$RUNNER_TEMP/portability-bundle/images.tar.gz" \
            >"$RUNNER_TEMP/portability-bundle/images.tar.gz.sha256"

      - name: Upload native candidate bundle
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: runtime-portability-images-${{ matrix.arch }}-${{ matrix.candidate }}
          path: ${{ runner.temp }}/portability-bundle
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  portability:
    name: run ${{ matrix.candidate }} on ${{ matrix.runner }}
    needs: build-native-bundle
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { runner: ubuntu-22.04,     arch: amd64, candidate: cups }
          - { runner: ubuntu-22.04,     arch: amd64, candidate: pappl }
          - { runner: ubuntu-24.04,     arch: amd64, candidate: cups }
          - { runner: ubuntu-24.04,     arch: amd64, candidate: pappl }
          - { runner: ubuntu-26.04,     arch: amd64, candidate: cups }
          - { runner: ubuntu-26.04,     arch: amd64, candidate: pappl }
          - { runner: ubuntu-22.04-arm, arch: arm64, candidate: cups }
          - { runner: ubuntu-22.04-arm, arch: arm64, candidate: pappl }
          - { runner: ubuntu-24.04-arm, arch: arm64, candidate: cups }
          - { runner: ubuntu-24.04-arm, arch: arm64, candidate: pappl }
          - { runner: ubuntu-26.04-arm, arch: arm64, candidate: cups }
          - { runner: ubuntu-26.04-arm, arch: arm64, candidate: pappl }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout FolioRelay
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download native candidate bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: runtime-portability-images-${{ matrix.arch }}-${{ matrix.candidate }}
          path: ${{ runner.temp }}/portability-bundle

      - name: Verify and load native images
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/portability-bundle"
          sha256sum -c images.tar.gz.sha256
          gzip -dc images.tar.gz | docker load

      - name: Install native IPP probe dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cups-ipp-utils curl

      - name: Execute real candidate portability rep
        shell: bash
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
          FOLIORELAY_PORTABILITY_NO_BUILD: 'true'
        run: |
          bash scripts/runtime-host-portability.sh \
            "${{ matrix.candidate }}" \
            "$RUNNER_TEMP/runtime-host-portability"

      - name: Upload portability evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: runtime-host-portability-${{ matrix.runner }}-${{ matrix.candidate }}
          path: ${{ runner.temp }}/runtime-host-portability
          if-no-files-found: warn
          retention-days: 14
