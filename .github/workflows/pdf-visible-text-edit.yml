name: PDF Visible Text Edit Synthetic Oracle

on:
  pull_request:
    paths:
      - 'tests/pdfderivation/**'
      - '.github/workflows/pdf-visible-text-edit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-visible-edit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install disposable PDF/Tesseract tools and fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng python3-pil python3-reportlab \
            python3-pikepdf fonts-dejavu-core fonts-thai-tlwg fontconfig \
            poppler-utils qpdf
      - name: Reconstruct visible OCR words and prove actual visual edit
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/foliorelay-visible-edit"
          mkdir -p "$evidence"
          python3 tests/pdfderivation/make_multilingual_images.py "$evidence"
          tesseract "$evidence/eng-raster.png" "$evidence/eng" -l eng tsv
          python3 tests/pdfderivation/reconstruct_visible_pdf.py \
            "$evidence/eng-raster.png" "$evidence/eng.tsv" \
            "$evidence/reconstructed.pdf"
          python3 tests/pdfderivation/edit_visible_pdf.py \
            "$evidence/reconstructed.pdf" "$evidence/modified.pdf"
          for name in reconstructed modified; do
            qpdf --check "$evidence/$name.pdf"
            pdftotext -enc UTF-8 "$evidence/$name.pdf" "$evidence/$name.txt"
            pdftoppm -f 1 -l 1 -r 150 -png -singlefile \
              "$evidence/$name.pdf" "$evidence/$name"
          done
          grep -q 'DOCUMENT' "$evidence/reconstructed.txt"
          grep -q 'DOCUMENX' "$evidence/modified.txt"
          if grep -q 'DOCUMENT' "$evidence/modified.txt"; then
            echo 'old visible token survived edit' >&2
            exit 1
          fi
          python3 - "$evidence/reconstructed.png" "$evidence/modified.png" \
            "$evidence/visible-diff.txt" <<'PY'
          from PIL import Image,ImageChops
          import sys
          with Image.open(sys.argv[1]).convert("RGB") as before:
              with Image.open(sys.argv[2]).convert("RGB") as after:
                  if before.size != after.size:
                      raise SystemExit("edited page changed dimensions")
                  delta=ImageChops.difference(before,after)
                  bbox=delta.getbbox()
                  if bbox is None:
                      raise SystemExit("text extraction changed but rendered output DID NOT")
                  grayscale=delta.convert("L")
                  touched=sum(v for n,v in enumerate(grayscale.histogram()) if n>8)
                  if touched < 10:
                      raise SystemExit("too few rendered pixels changed")
                  with open(sys.argv[3],"w",encoding="utf-8") as out:
                      out.write(f"visible pixel diff bbox={bbox} altered_pixels={touched}\n")
                  print(f"PASS actual visible edit; changed pixels {touched}")
          PY
          (cd "$evidence" && sha256sum reconstructed.pdf modified.pdf) \
            > "$evidence/sha256.txt"
          printf '%s\n' \
            'PASS: OCR boxed text reconstructed into PDF visible text objects and edited' \
            'LIMIT: font, geometry, color, images and tables NOT fidelity-qualified' \
            > "$evidence/qualification.txt"
      - name: Upload synthetic-only before/after PDF visual receipts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: foliorelay-visible-text-edit-proof
          path: ${{ runner.temp }}/foliorelay-visible-edit/
          retention-days: 7
          if-no-files-found: warn
