name: Physical Client HIL Tooling

on:
  pull_request:
    paths:
      - '.github/workflows/physical-client-hil-tooling.yml'
      - 'tools/physical-hil-observer/**'
      - 'scripts/hil/**'
      - 'docs/PHYSICAL_CLIENT_HIL.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observer-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false
      - name: Test physical HIL observer
        run: |
          set -euo pipefail
          go test ./tools/physical-hil-observer
          go build -trimpath -o "$RUNNER_TEMP/physical-hil-observer" ./tools/physical-hil-observer
          "$RUNNER_TEMP/physical-hil-observer" -h >/dev/null

  observer-windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false
      - name: Test observer and PowerShell collector syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./tools/physical-hil-observer
          go build -trimpath -o "$env:RUNNER_TEMP\physical-hil-observer.exe" ./tools/physical-hil-observer
          & "$env:RUNNER_TEMP\physical-hil-observer.exe" -h | Out-Null
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/hil/Invoke-FolioRelayPhysicalHil.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List * | Out-String | Write-Error
          }
          $scriptText = Get-Content -Raw 'scripts/hil/Invoke-FolioRelayPhysicalHil.ps1'
          $docText = Get-Content -Raw 'docs/PHYSICAL_CLIENT_HIL.md'
          foreach ($needle in @(
            '$ExpectedManagementPort = 18443',
            'BaseUrl must be the supported FolioRelay HTTPS management portal',
            'RemoteCertificateNameMismatch',
            'management_tls_fingerprint_sha256',
            'WindowsWebUiConfirmed',
            'AppleWebUiConfirmed'
          )) {
            if (-not $scriptText.Contains($needle)) {
              throw "physical HIL HTTPS/WebUI contract missing: $needle"
            }
          }
          if (-not $docText.Contains('https://<foliorelay-host>:18443')) {
            throw 'physical HIL docs must use the supported HTTPS portal'
          }
          if ($docText.Contains('http://<foliorelay-host>:18080')) {
            throw 'physical HIL docs must not expose retired LAN HTTP management'
          }
          if (-not $docText.Contains('sha256:d0ba6d1efbed0d9f84b20d374eeb44ee28ab0874a683396e628850f159193cf5')) {
            throw 'physical HIL docs must bind the current control image'
          }
