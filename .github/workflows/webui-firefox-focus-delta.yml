name: FolioRelay Firefox Focus Delta

on:
  pull_request:
    paths:
      - '.ci/static-hci-playwright.mjs'
      - 'tests/webui/**'
      - 'internal/webui/**'
      - 'internal/control/**'
      - 'cmd/foliorelayd/**'
      - 'package.json'
      - 'playwright.config.mjs'
      - '.github/workflows/webui-firefox-focus-delta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox-focus-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Prove control contract
        run: go test ./internal/control

      - name: Install WebUI test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Firefox only
        run: npx playwright install firefox

      - name: Reproduce only the prior Firefox keyboard falsifier
        run: npx playwright test --project=desktop-firefox --grep "desktop keyboard traversal reaches every critical control without obscuration"

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: foliorelay-firefox-focus-delta
          path: |
            build/playwright-report
            build/playwright-results
          if-no-files-found: ignore
          retention-days: 14
