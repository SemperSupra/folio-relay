name: Print Substrate Stress

on:
  pull_request:
    paths:
      - 'cmd/foliorelay-ipp-ingest/**'
      - 'cmd/foliorelay-state-fixture/**'
      - 'internal/security/**'
      - 'internal/state/**'
      - 'docs/RED_BLUE_PRINT_SUBSTRATE.md'
      - 'contracts/print-substrate-evaluation.yaml'
      - '.github/workflows/print-substrate-stress.yml'
  push:
    branches: [main]
    paths:
      - 'cmd/foliorelay-ipp-ingest/**'
      - 'cmd/foliorelay-state-fixture/**'
      - 'internal/security/**'
      - 'internal/state/**'
      - '.github/workflows/print-substrate-stress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ippeve-failure-pressure:
    name: ippeveprinter - FolioRelay failure pressure
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FOLIORELAY_SUBSTRATE_INSTANCE: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout FolioRelay
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Build FolioRelay fixtures
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/foliorelay-ipp-ingest ./internal/security ./internal/state
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/ingress"
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/bin/foliorelay-state-fixture" ./cmd/foliorelay-state-fixture
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/bin/foliorelay-ipp-ingest" ./cmd/foliorelay-ipp-ingest

      - name: Build pinned ippeveprinter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             autoconf build-essential pkg-config git ca-certificates curl             libssl-dev zlib1g-dev libcups2-dev cups-client cups-ipp-utils
          git clone --depth 1 --branch v2.4.19 https://github.com/OpenPrinting/cups.git "$RUNNER_TEMP/cups"
          cd "$RUNNER_TEMP/cups"
          ./configure             --prefix=/usr             --with-tls=openssl             --with-dnssd=no             --disable-pam             --disable-gssapi             --disable-libusb             --disable-webif             --disable-browsing             --disable-default-shared             --disable-raw-printing             --with-languages=none
          make -C cups -j"$(nproc)"
          make -C tools -j"$(nproc)" ippeveprinter-static

      - name: Create deterministic test document
        shell: bash
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/sample.pdf" <<'PDF'
          %PDF-1.1
          1 0 obj
          << /Type /Catalog /Pages 2 0 R >>
          endobj
          2 0 obj
          << /Type /Pages /Kids [3 0 R] /Count 1 >>
          endobj
          3 0 obj
          << /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] >>
          endobj
          trailer
          << /Root 1 0 R >>
          %%EOF
          PDF
          sha256sum "$RUNNER_TEMP/sample.pdf" | tee "$RUNNER_TEMP/evidence/sample.sha256"

      - name: Start state authority and ingress
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/state"
          "$RUNNER_TEMP/bin/foliorelay-state-fixture" -listen 127.0.0.1:18080             -journal "$RUNNER_TEMP/state/journal.frj"             >"$RUNNER_TEMP/evidence/state.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/evidence/state.pid"

          mkdir -p "$RUNNER_TEMP/ippeve-spool"
          FOLIORELAY_STATE_URL=http://127.0.0.1:18080           FOLIORELAY_INGRESS_STORE="$RUNNER_TEMP/ingress"           FOLIORELAY_MAX_INGRESS_BYTES=104857600           FOLIORELAY_SUBSTRATE_INSTANCE="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"           "$RUNNER_TEMP/cups/tools/ippeveprinter-static"             -r off -p 8632 -d "$RUNNER_TEMP/ippeve-spool" -k             -f application/pdf,image/pwg-raster             -c "$RUNNER_TEMP/bin/foliorelay-ipp-ingest"             "FolioRelay Stress"             >"$RUNNER_TEMP/evidence/ippeve.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/evidence/ippeve.pid"

          for i in $(seq 1 45); do
            state_ok=0; ipp_ok=0
            curl -fsS -o /dev/null http://127.0.0.1:18080/health && state_ok=1 || true
            curl -fsS -o /dev/null http://127.0.0.1:8632/ && ipp_ok=1 || true
            if [ "$state_ok" -eq 1 ] && [ "$ipp_ok" -eq 1 ]; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Prove exclusive durable-state writer lease
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 5 "$RUNNER_TEMP/bin/foliorelay-state-fixture" \
            -listen 127.0.0.1:18081 \
            -journal "$RUNNER_TEMP/state/journal.frj" \
            >"$RUNNER_TEMP/evidence/second-writer.out" 2>&1
          rc=$?
          set -e
          echo "$rc" >"$RUNNER_TEMP/evidence/second-writer.rc"
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ]; then
            echo "second state authority did not fail closed on the active journal lease" >&2
            cat "$RUNNER_TEMP/evidence/second-writer.out" >&2 || true
            exit 1
          fi
          grep -q "journal already has an active writer" "$RUNNER_TEMP/evidence/second-writer.out"

      - name: Concurrent real Print-Job submissions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/concurrent"
          seq 1 100 | xargs -P 25 -I{} bash -c '
            set +e
            ipptool -t -f "$1" ipp://127.0.0.1:8632/ipp/print "$2/examples/print-job.test" >"$3/{}.out" 2>"$3/{}.err"
            echo $? >"$3/{}.rc"
            exit 0
          ' _ "$RUNNER_TEMP/sample.pdf" "$RUNNER_TEMP/cups" "$RUNNER_TEMP/concurrent"

          successes="$(grep -l '^0$' "$RUNNER_TEMP"/concurrent/*.rc | wc -l)"
          failures=$((100-successes))
          printf '{"attempts":100,"successes":%s,"failures":%s}\n' "$successes" "$failures" | tee "$RUNNER_TEMP/evidence/concurrent-client-results.json"
          if [ "$failures" -gt 0 ]; then
            {
              echo "Sample failed client outputs:"
              grep -L '^0$' "$RUNNER_TEMP"/concurrent/*.rc | head -5 | while read -r file; do
                base="${file%.rc}"
                echo "=== $base ==="
                cat "$base.out" || true
                cat "$base.err" || true
              done
            } | tee "$RUNNER_TEMP/evidence/concurrent-failures.txt"
          fi

          for i in $(seq 1 60); do
            stats="$(curl -fsS http://127.0.0.1:18080/v1/stats)"
            accepted="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["accepted"])' <<<"$stats")"
            if [ "$accepted" -ge "$successes" ]; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/v1/stats | tee "$RUNNER_TEMP/evidence/concurrent-stats.json"
          python3 - "$RUNNER_TEMP/evidence/concurrent-stats.json" "$RUNNER_TEMP/evidence/concurrent-client-results.json" "$RUNNER_TEMP/evidence/concurrent-failures.txt" <<'PY'
          import json, pathlib, sys
          stats=json.loads(pathlib.Path(sys.argv[1]).read_text())
          clients=json.loads(pathlib.Path(sys.argv[2]).read_text())
          failures=pathlib.Path(sys.argv[3]).read_text(errors="replace") if pathlib.Path(sys.argv[3]).exists() else ""
          assert stats["accepted"] == clients["successes"], (stats, clients)
          assert stats["conflicts"] == 0, stats
          assert clients["successes"] > 0, clients
          assert clients["failures"] > 0, clients
          assert "server-error-busy" in failures or "Currently printing another job" in failures, failures
          status={
              "candidate":"ippeveprinter",
              "production_status":"vetoed",
              "reason":"upstream accepts only one active job at a time",
              "attempts":clients["attempts"],
              "accepted":clients["successes"],
              "busy_or_failed":clients["failures"],
          }
          pathlib.Path(sys.argv[2]).with_name("ippeve-candidate-status.json").write_text(json.dumps(status, indent=2)+"\n")
          print(json.dumps(status, indent=2))
          PY
          test "$(find "$RUNNER_TEMP/ingress/sha256" -type f | wc -l)" -eq 1

      - name: Prove authoritative million-copy rejection
        shell: bash
        env:
          CONTENT_TYPE: application/pdf
          IPP_JOB_ID: "million-copies"
          IPP_COPIES: "1000000"
          FOLIORELAY_STATE_URL: http://127.0.0.1:18080
          FOLIORELAY_INGRESS_STORE: ${{ runner.temp }}/ingress
          FOLIORELAY_SUBSTRATE_INSTANCE: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if "$RUNNER_TEMP/bin/foliorelay-ipp-ingest" "$RUNNER_TEMP/sample.pdf"               >"$RUNNER_TEMP/evidence/million-copy.out"               2>"$RUNNER_TEMP/evidence/million-copy.err"; then
            echo "million-copy request unexpectedly passed authoritative admission" >&2
            exit 1
          fi
          grep -q "state authority rejected ingest" "$RUNNER_TEMP/evidence/million-copy.err"
          stats="$(curl -fsS http://127.0.0.1:18080/v1/stats)"
          python3 -c 'import json,sys; s=json.load(sys.stdin); assert s["rejected"] >= 1, s' <<<"$stats"
          printf '%s\n' "$stats" >"$RUNNER_TEMP/evidence/post-million-copy-stats.json"

      - name: Slow and malformed client pressure does not kill service
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >"$RUNNER_TEMP/evidence/malformed-clients.txt"
          import socket, threading, time
          errors=[]
          def slow(i):
              try:
                  s=socket.create_connection(("127.0.0.1",8632), timeout=3)
                  s.sendall(b"POST /ipp/print HTTP/1.1\r\nHost: localhost\r\nContent-Length: 999999999\r\nContent-Type: application/ipp\r\n")
                  time.sleep(1.5)
                  s.close()
              except Exception as e:
                  errors.append((i,repr(e)))
          threads=[threading.Thread(target=slow,args=(i,)) for i in range(50)]
          for t in threads: t.start()
          time.sleep(.25)
          # Also send obviously malformed HTTP.
          for payload in [b"GARBAGE\r\n\r\n", b"POST /ipp/print HTTP/1.1\r\nContent-Length: nope\r\n\r\n"]:
              try:
                  s=socket.create_connection(("127.0.0.1",8632), timeout=3)
                  s.sendall(payload); s.close()
              except Exception as e:
                  errors.append(("malformed",repr(e)))
          for t in threads: t.join()
          print(errors)
          PY
          curl -fsS http://127.0.0.1:8632/ >/dev/null
          ipptool -q ipp://127.0.0.1:8632/ipp/print             "$RUNNER_TEMP/cups/examples/get-printer-attributes.test"
          curl -fsS http://127.0.0.1:18080/health -o /dev/null

      - name: State-authority outage fails closed and restart recovers
        shell: bash
        env:
          FOLIORELAY_SUBSTRATE_INSTANCE: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          # Establish a deterministic durable command before the crash.
          CONTENT_TYPE=application/pdf \
          IPP_JOB_ID=restart-probe \
          FOLIORELAY_STATE_URL=http://127.0.0.1:18080 \
          FOLIORELAY_INGRESS_STORE="$RUNNER_TEMP/ingress" \
          "$RUNNER_TEMP/bin/foliorelay-ipp-ingest" "$RUNNER_TEMP/sample.pdf" \
            >"$RUNNER_TEMP/evidence/restart-probe-before.out" \
            2>"$RUNNER_TEMP/evidence/restart-probe-before.err"

          kill "$(cat "$RUNNER_TEMP/evidence/state.pid")"
          wait "$(cat "$RUNNER_TEMP/evidence/state.pid")" || true

          # With the authority unavailable, the adapter may stage immutable
          # bytes but must not optimistically accept a state transition.
          CONTENT_TYPE=application/pdf \
          IPP_JOB_ID=authority-down \
          FOLIORELAY_STATE_URL=http://127.0.0.1:18080 \
          FOLIORELAY_INGRESS_STORE="$RUNNER_TEMP/ingress" \
          "$RUNNER_TEMP/bin/foliorelay-ipp-ingest" "$RUNNER_TEMP/sample.pdf" \
            >"$RUNNER_TEMP/evidence/authority-down.out" \
            2>"$RUNNER_TEMP/evidence/authority-down.err" && {
              echo "adapter accepted work with authority unavailable" >&2
              exit 1
            }
          grep -q "state authority unavailable" "$RUNNER_TEMP/evidence/authority-down.err"

          "$RUNNER_TEMP/bin/foliorelay-state-fixture" -listen 127.0.0.1:18080 \
            -journal "$RUNNER_TEMP/state/journal.frj" \
            >>"$RUNNER_TEMP/evidence/state.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/evidence/state.pid"
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:18080/health && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:18080/health

          # Same durable command must replay, not create a second transition.
          CONTENT_TYPE=application/pdf \
          IPP_JOB_ID=restart-probe \
          FOLIORELAY_STATE_URL=http://127.0.0.1:18080 \
          FOLIORELAY_INGRESS_STORE="$RUNNER_TEMP/ingress" \
          "$RUNNER_TEMP/bin/foliorelay-ipp-ingest" "$RUNNER_TEMP/sample.pdf" \
            >"$RUNNER_TEMP/evidence/restart-probe-after.out" \
            2>"$RUNNER_TEMP/evidence/restart-probe-after.err"

          stats="$(curl -fsS http://127.0.0.1:18080/v1/stats)"
          printf '%s\n' "$stats" >"$RUNNER_TEMP/evidence/post-restart-stats.json"
          python3 -c 'import json,sys; s=json.load(sys.stdin); assert s["accepted"] == 0 and s["replayed"] == 1, s' <<<"$stats"

          # The outage command was never accepted. Retrying after recovery is a
          # first acceptance, not a replay.
          CONTENT_TYPE=application/pdf \
          IPP_JOB_ID=authority-down \
          FOLIORELAY_STATE_URL=http://127.0.0.1:18080 \
          FOLIORELAY_INGRESS_STORE="$RUNNER_TEMP/ingress" \
          "$RUNNER_TEMP/bin/foliorelay-ipp-ingest" "$RUNNER_TEMP/sample.pdf" \
            >"$RUNNER_TEMP/evidence/authority-down-retry.out" \
            2>"$RUNNER_TEMP/evidence/authority-down-retry.err"

          stats="$(curl -fsS http://127.0.0.1:18080/v1/stats)"
          printf '%s\n' "$stats" >"$RUNNER_TEMP/evidence/post-outage-retry-stats.json"
          python3 -c 'import json,sys; s=json.load(sys.stdin); assert s["accepted"] == 1 and s["replayed"] == 1, s' <<<"$stats"

          ipptool -q ipp://127.0.0.1:8632/ipp/print \
            "$RUNNER_TEMP/cups/examples/get-printer-attributes.test"

      - name: Bounded spool exhaustion remains local
        shell: bash
        run: |
          set -euo pipefail
          kill "$(cat "$RUNNER_TEMP/evidence/ippeve.pid")"
          wait "$(cat "$RUNNER_TEMP/evidence/ippeve.pid")" || true

          mkdir -p "$RUNNER_TEMP/tiny-spool"
          sudo mount -t tmpfs -o size=2m,mode=0700 tmpfs "$RUNNER_TEMP/tiny-spool"
          trap 'sudo umount "$RUNNER_TEMP/tiny-spool" || true' EXIT

          FOLIORELAY_STATE_URL=http://127.0.0.1:18080           FOLIORELAY_INGRESS_STORE="$RUNNER_TEMP/ingress"           "$RUNNER_TEMP/cups/tools/ippeveprinter-static"             -r off -p 8632 -d "$RUNNER_TEMP/tiny-spool" -k             -f application/pdf             -c "$RUNNER_TEMP/bin/foliorelay-ipp-ingest"             "FolioRelay Tiny Spool"             >>"$RUNNER_TEMP/evidence/ippeve.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/evidence/ippeve.pid"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8632/ >/dev/null 2>&1 && break
            sleep 1
          done

          { printf '%%PDF-1.1\n'; dd if=/dev/zero bs=1M count=4 status=none; printf '\n%%%%EOF\n'; }             >"$RUNNER_TEMP/oversize-spool.pdf"

          set +e
          timeout 30 ipptool -q -f "$RUNNER_TEMP/oversize-spool.pdf"             ipp://127.0.0.1:8632/ipp/print             "$RUNNER_TEMP/cups/examples/print-job-and-wait.test"             >"$RUNNER_TEMP/evidence/spool-full.out"             2>"$RUNNER_TEMP/evidence/spool-full.err"
          print_rc=$?
          set -e
          echo "$print_rc" >"$RUNNER_TEMP/evidence/spool-full-rc.txt"

          # Whether the client sees a reject or aborted job, ingress exhaustion
          # must not kill the protocol/control surfaces.
          curl -fsS http://127.0.0.1:8632/ >/dev/null
          curl -fsS http://127.0.0.1:18080/health -o /dev/null
          df -h "$RUNNER_TEMP/tiny-spool" >"$RUNNER_TEMP/evidence/tiny-spool-df.txt"

          kill "$(cat "$RUNNER_TEMP/evidence/ippeve.pid")" 2>/dev/null || true
          wait "$(cat "$RUNNER_TEMP/evidence/ippeve.pid")" || true
          sudo umount "$RUNNER_TEMP/tiny-spool"
          trap - EXIT

      - name: Upload ippeve failure evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: print-substrate-stress-ippeve
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 14

  pappl-upstream-pressure:
    name: PAPPL - upstream concurrency pressure
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout FolioRelay
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build PAPPL 1.4.11
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             autoconf build-essential pkg-config git ca-certificates             libssl-dev zlib1g-dev libavahi-client-dev libcups2-dev cups-ipp-utils             libpng-dev libjpeg-dev
          git clone --depth 1 --branch v1.4.11 https://github.com/michaelrsweet/pappl.git "$RUNNER_TEMP/pappl"
          cd "$RUNNER_TEMP/pappl"
          ./configure             --with-dnssd=avahi             --with-tls=openssl             --disable-libpam             --disable-libusb             --disable-shared
          make -j"$(nproc)"
          make -C testsuite -j"$(nproc)"
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/pappl-output"

      - name: Characterize PAPPL concurrency frontier
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pappl"
          : >"$RUNNER_TEMP/evidence/pappl-load-results.tsv"
          overall=0

          for spec in 25x100 100x100 100x1000 250x100 500x20; do
            rm -rf "$RUNNER_TEMP/pappl-output"
            mkdir -p "$RUNNER_TEMP/pappl-output"
            out="$RUNNER_TEMP/evidence/pappl-$spec.txt"
            log="$RUNNER_TEMP/evidence/pappl-$spec.log"

            set +e
            timeout 360 testsuite/testpappl \
              -c -l "$log" -L warn \
              -o "$RUNNER_TEMP/pappl-output" \
              -t "client-$spec" >"$out" 2>&1
            rc=$?
            set -e

            summary="$(grep -aE 'PASS|FAIL.*requests/sec|FAILED:|PASSED:' "$out" | tail -3 | tr '\n' ' ' || true)"
            printf '%s\t%s\t%s\n' "$spec" "$rc" "$summary" | tee -a "$RUNNER_TEMP/evidence/pappl-load-results.tsv"

            # Operational gate: 100 simultaneous clients over a sustained
            # 10k-request run must be error-free. Larger/longer tiers are
            # characterization evidence and remain visible even if degraded.
            if [ "$spec" = "100x100" ] && [ "$rc" -ne 0 ]; then
              overall=1
            fi
          done

          cat "$RUNNER_TEMP/evidence/pappl-load-results.tsv"
          python3 - "$RUNNER_TEMP/evidence/pappl-load-results.tsv" <<'PY'
          import json, pathlib, re, sys
          rows=[]
          for line in pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines():
              spec, rc, summary = line.split("\t", 2)
              m=re.search(r'([0-9.]+) seconds, ([0-9.]+) requests/sec, ([0-9]+) errors', summary)
              rows.append({
                  "spec":spec,
                  "return_code":int(rc),
                  "seconds":float(m.group(1)) if m else None,
                  "requests_per_sec":float(m.group(2)) if m else None,
                  "errors":int(m.group(3)) if m else None,
                  "summary":summary,
              })
          out=pathlib.Path(sys.argv[1]).with_suffix(".json")
          out.write_text(json.dumps(rows, indent=2)+"\n")
          print(json.dumps(rows, indent=2))
          PY
          exit "$overall"

      - name: Independently characterize minimal PAPPL client pressure
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/pappl-external-spool"

          cc -D_GNU_SOURCE \
            -I"$RUNNER_TEMP/pappl" -I"$RUNNER_TEMP/pappl/pappl" \
            $(cups-config --cflags) \
            -o "$RUNNER_TEMP/bin/foliorelay-pappl-ingress" \
            experiments/print-substrate/pappl-ingress.c \
            "$RUNNER_TEMP/pappl/pappl/libpappl.a" \
            $(cups-config --image --libs) \
            $(pkg-config --libs openssl libjpeg libpng zlib avahi-client) \
            -lpthread -lm

          FOLIORELAY_INGEST_BIN=/bin/true \
          FOLIORELAY_PAPPL_SPOOL="$RUNNER_TEMP/pappl-external-spool" \
          FOLIORELAY_PAPPL_PORT=8633 \
            "$RUNNER_TEMP/bin/foliorelay-pappl-ingress" \
            >"$RUNNER_TEMP/evidence/pappl-external.log" 2>&1 &
          pappl_pid=$!
          echo "$pappl_pid" >"$RUNNER_TEMP/evidence/pappl-external.pid"
          trap 'kill "$pappl_pid" 2>/dev/null || true; wait "$pappl_pid" 2>/dev/null || true' EXIT

          testfile="$(find /usr/share/cups -type f -name get-printer-attributes.test -print -quit)"
          test -n "$testfile"
          for i in $(seq 1 30); do
            if ipptool -q ipp://127.0.0.1:8633/ipp/print "$testfile"; then
              break
            fi
            sleep 1
          done
          ipptool -q ipp://127.0.0.1:8633/ipp/print "$testfile"

          run_tier() {
            repeats="$1"
            label="$2"
            dir="$RUNNER_TEMP/pappl-external-$label"
            rm -rf "$dir"
            mkdir -p "$dir"
            export FOLIORELAY_PAPPL_TESTFILE="$testfile"
            export FOLIORELAY_PAPPL_TESTDIR="$dir"
            export FOLIORELAY_PAPPL_REPEATS="$repeats"

            seq 1 100 | xargs -P 100 -I{} bash -c '
              set +e
              timeout 240 ipptool -I -q -T 15 -n "$FOLIORELAY_PAPPL_REPEATS" \
                ipp://127.0.0.1:8633/ipp/print "$FOLIORELAY_PAPPL_TESTFILE" \
                >"$FOLIORELAY_PAPPL_TESTDIR/{}.out" \
                2>"$FOLIORELAY_PAPPL_TESTDIR/{}.err"
              rc=$?
              echo "$rc" >"$FOLIORELAY_PAPPL_TESTDIR/{}.rc"
              exit 0
            '

            failures="$(awk '$0 != "0" { n++ } END { print n + 0 }' "$dir"/*.rc)"
            timeouts="$(awk '$0 == "124" { n++ } END { print n + 0 }' "$dir"/*.rc)"
            printf '{"clients":100,"requests_per_client":%s,"failed_clients":%s,"timed_out_clients":%s}\n' \
              "$repeats" "$failures" "$timeouts" \
              | tee "$RUNNER_TEMP/evidence/pappl-external-$label.json"
          }

          # Match the existing 100x100 operational gate using independent
          # client processes against the actual minimal FolioRelay PAPPL fixture.
          run_tier 100 100x100
          python3 - "$RUNNER_TEMP/evidence/pappl-external-100x100.json" <<'PY'
          import json, pathlib, sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert result["failed_clients"] == 0, result
          PY

          # The longer 100k-request tier remains characterization evidence:
          # record degradation without silently promoting it to a hard gate.
          run_tier 1000 100x1000

          kill "$pappl_pid"
          wait "$pappl_pid" 2>/dev/null || true
          trap - EXIT

      - name: Upload PAPPL evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: print-substrate-stress-pappl
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 14

  cups-upstream-suite:
    name: CUPS - upstream scheduler suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout FolioRelay
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build and test CUPS 2.4.19
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             autoconf build-essential pkg-config git ca-certificates             libssl-dev zlib1g-dev libavahi-client-dev
          git clone --depth 1 --branch v2.4.19 https://github.com/OpenPrinting/cups.git "$RUNNER_TEMP/cups"
          cd "$RUNNER_TEMP/cups"
          ./configure             --prefix=/usr             --with-tls=openssl             --with-dnssd=avahi             --disable-pam             --disable-gssapi             --disable-libusb             --disable-webif             --disable-browsing             --disable-default-shared             --disable-raw-printing             --with-languages=none             --with-printcap=no             --with-max-copies=1000             --enable-unit-tests
          make -j"$(nproc)"
          mkdir -p "$RUNNER_TEMP/evidence"
          set +e
          timeout 360 make test             >"$RUNNER_TEMP/evidence/cups-make-test.txt" 2>&1
          rc=$?
          set -e
          echo "$rc" >"$RUNNER_TEMP/evidence/cups-make-test-rc.txt"
          if [ "$rc" -ne 0 ]; then
            tail -160 "$RUNNER_TEMP/evidence/cups-make-test.txt"
            exit "$rc"
          fi

      - name: Upload CUPS evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: print-substrate-stress-cups
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 14
