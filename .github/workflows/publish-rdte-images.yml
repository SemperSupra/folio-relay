name: FolioRelay RDTE OCI publication

on:
  pull_request:
    branches:
      - mvp/production-cups-airprint
    paths:
      - ".github/workflows/publish-rdte-images.yml"
      - "deploy/control/**"
      - "cmd/foliorelayd/**"
      - "cmd/foliorelay-probe/**"
      - "cmd/foliorelay-dnssd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-control:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CONTROL_IMAGE: ghcr.io/sempersupra/foliorelay-control
      CUPS_IMAGE: ghcr.io/sempersupra/foliorelay-cups
      CUPS_DIGEST: sha256:0997ad2054ca5e57f34291372aed55f549eee9ff201f171b430436b0655c0814
    steps:
      - name: Checkout exact publication candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Derive immutable control tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="rdte-${{ github.event.pull_request.base.sha }}"
          tag="${tag:0:17}"
          {
            echo "tag=$tag"
            echo "control_reference=$CONTROL_IMAGE:$tag"
          } >>"$GITHUB_OUTPUT"

      - name: Build exact control smoke image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: deploy/control/Dockerfile
          load: true
          push: false
          provenance: false
          sbom: false
          tags: foliorelay-control:publish-smoke
          cache-to: type=gha,mode=max,scope=foliorelay-control-rdte

      - name: Smoke HTTPS management and private HTTP separation
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cid=""
          cleanup() {
            [[ -z "$cid" ]] || docker rm -f "$cid" >/dev/null 2>&1 || true
            sudo rm -rf "$tmp"
          }
          trap cleanup EXIT
          mkdir -p "$tmp/data"
          printf '%s\n' 'rdte-publication-token-0000000001' >"$tmp/token"
          sudo chown -R 10001:10001 "$tmp/data" "$tmp/token"
          sudo chmod 0700 "$tmp/data"
          sudo chmod 0400 "$tmp/token"

          cid="$(docker run -d --read-only             -p 127.0.0.1:18443:18443             -v "$tmp/data:/var/lib/foliorelay"             -v "$tmp/token:/run/foliorelay-token:ro"             foliorelay-control:publish-smoke             -listen 0.0.0.0:18080             -https-listen 0.0.0.0:18443             -tls-state-dir /var/lib/foliorelay/tls             -journal /var/lib/foliorelay/journal.frj             -artifact-store /var/lib/foliorelay/artifacts             -token-file /run/foliorelay-token             -identity-file /var/lib/foliorelay/printer-identity.json             -printer-uri ipp://foliorelay-rdte.local:8634/printers/FolioRelay             -airprint)"

          for _ in $(seq 1 60); do
            if curl -kfsS https://127.0.0.1:18443/healthz >/dev/null 2>&1 &&
               curl -kfsS https://127.0.0.1:18443/readyz >/dev/null 2>&1; then
              break
            fi
            docker inspect "$cid" --format '{{.State.Running}}' | grep -qx true || {
              docker logs "$cid"
              exit 1
            }
            sleep 1
          done
          curl -kfsS https://127.0.0.1:18443/readyz >/dev/null
          ports="$(docker port "$cid")"
          grep -Eq '^18443/tcp -> 127\.0\.0\.1:18443$' <<<"$ports"
          ! grep -q '^18080/tcp ->' <<<"$ports"

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push exact control artifact
        id: control_publish
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: deploy/control/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.control_reference }}
          labels: |
            org.opencontainers.image.source=https://github.com/SemperSupra/folio-relay
            org.opencontainers.image.revision=${{ github.event.pull_request.base.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            io.sempersupra.foliorelay.component=control
          cache-from: type=gha,scope=foliorelay-control-rdte

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003

      - name: Sign exact control digest
        env:
          CONTROL_DIGEST: ${{ steps.control_publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONTROL_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "$CONTROL_IMAGE@$CONTROL_DIGEST"

      - name: Prove anonymous pulls and existing CUPS immutability
        env:
          CONTROL_DIGEST: ${{ steps.control_publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull "$CONTROL_IMAGE@$CONTROL_DIGEST"
          docker pull "$CUPS_IMAGE@$CUPS_DIGEST"
          [[ "$(docker image inspect "$CONTROL_IMAGE@$CONTROL_DIGEST" --format '{{index .RepoDigests 0}}')" == "$CONTROL_IMAGE@$CONTROL_DIGEST" ]]
          [[ "$(docker image inspect "$CUPS_IMAGE@$CUPS_DIGEST" --format '{{index .RepoDigests 0}}')" == "$CUPS_IMAGE@$CUPS_DIGEST" ]]

      - name: Verify keyless signatures
        env:
          CONTROL_DIGEST: ${{ steps.control_publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          identity='^https://github.com/SemperSupra/folio-relay/.github/workflows/publish-rdte-images.yml@refs/.*$'
          issuer='https://token.actions.githubusercontent.com'
          cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer"             "$CONTROL_IMAGE@$CONTROL_DIGEST" >/tmp/control-cosign.json
          cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer"             "$CUPS_IMAGE@$CUPS_DIGEST" >/tmp/cups-cosign.json

      - name: Emit sanitized publication receipt
        env:
          CONTROL_DIGEST: ${{ steps.control_publish.outputs.digest }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRODUCT_HEAD: ${{ github.event.pull_request.base.sha }}
          PUBLICATION_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/foliorelay-publication
          python3 - <<'PY' | tee /tmp/foliorelay-publication/receipt.json
          import json, os
          print(json.dumps({
            "schema": "semper-supra.foliorelay-rdte-publication/1",
            "status": "PASS",
            "source_revision": os.environ["PRODUCT_HEAD"],
            "publication_revision": os.environ["PUBLICATION_HEAD"],
            "tag": os.environ["TAG"],
            "control": {
              "image": "ghcr.io/sempersupra/foliorelay-control",
              "digest": os.environ["CONTROL_DIGEST"],
              "anonymous_pull": True,
              "signed_keyless": True,
              "rebuilt": True
            },
            "cups": {
              "image": "ghcr.io/sempersupra/foliorelay-cups",
              "digest": os.environ["CUPS_DIGEST"],
              "anonymous_pull": True,
              "signed_keyless": True,
              "rebuilt": False,
              "reused_from_publication_run": 37457117549,
              "reused_from_artifact": 11410550658
            },
            "sbom_attestation_requested": True,
            "provenance_attestation_requested": True,
            "release_published": False,
            "moving_tag_published": False,
            "secrets_captured": False,
            "money_spent_usd": 0
          }, indent=2, sort_keys=True))
          PY

      - name: Upload exact publication receipt
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: foliorelay-rdte-publication
          path: /tmp/foliorelay-publication/receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
