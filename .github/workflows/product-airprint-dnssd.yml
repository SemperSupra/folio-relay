name: Product AirPrint DNS-SD

on:
  pull_request:
    paths:
      - 'cmd/foliorelay-dnssd/**'
      - 'internal/airprint/**'
      - 'internal/dnssd/**'
      - 'internal/printer/**'
      - 'deploy/control/**'
      - 'deploy/engineering-cups/**'
      - 'deploy/mvp/**'
      - 'experiments/print-substrate/cups-foliorelay.ppd'
      - '.github/workflows/product-airprint-dnssd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-dnssd:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout FolioRelay
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install independent DNS-SD and IPP observers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends avahi-daemon avahi-utils dbus cups-ipp-utils jq
          sudo mkdir -p /run/dbus
          pgrep -x dbus-daemon >/dev/null 2>&1 || sudo dbus-daemon --system --fork
          sudo systemctl restart avahi-daemon || sudo avahi-daemon --daemonize --no-chroot

      - name: Prepare exact MVP runtime identity
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/foliorelay-dnssd"
          token="$root/control.token"
          sudo mkdir -p "$root/control" "$root/artifacts" "$root/cups-state" "$root/cups-spool"
          printf '%s\n' 'foliorelay-dnssd-fixture-token-0001' | sudo tee "$token" >/dev/null
          sudo chown -R 10001:10001 "$root/control" "$root/artifacts" "$root/cups-state" "$root/cups-spool" "$token"
          sudo chmod 0750 "$root/control"
          sudo chmod 0700 "$root/artifacts"
          sudo chmod 0755 "$root/cups-state" "$root/cups-spool"
          sudo chmod 0400 "$token"
          host_ipv4="$(ip -4 route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($i=="src"){print $(i+1); exit}}')"
          test -n "$host_ipv4"
          public_host="foliorelay-ci-${GITHUB_RUN_ID}.local"
          printf '%s %s\n' "$host_ipv4" "$public_host" | sudo tee -a /etc/hosts >/dev/null
          {
            echo "FOLIORELAY_DATA_ROOT=$root"
            echo "FOLIORELAY_TOKEN_FILE=$token"
            echo "FOLIORELAY_PUBLIC_HOST=$public_host"
            echo "FOLIORELAY_PUBLIC_PRINTER_URI=ipp://$public_host:8634/printers/FolioRelay"
            echo "FOLIORELAY_PRINTER_NAME=FolioRelay"
            echo "FOLIORELAY_PRINTER_LOCATION=RDTE"
          } >>"$GITHUB_ENV"

      - name: Start control/CUPS and host-side Avahi publisher
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/foliorelay-dnssd-evidence"
          mkdir -p "$evidence"
          docker compose -f deploy/mvp/compose.yaml up -d --build control cups

          go build -trimpath -o "$RUNNER_TEMP/foliorelay-dnssd-publisher.build" ./cmd/foliorelay-dnssd
          publisher="/tmp/foliorelay-dnssd-publisher-${GITHUB_RUN_ID}"
          sudo install -o 65534 -g 10001 -m 0555 "$RUNNER_TEMP/foliorelay-dnssd-publisher.build" "$publisher"
          : >"$evidence/discovery.log"
          sudo setpriv --reuid=65534 --regid=10001 --clear-groups \
            test -x "$publisher"
          identity="$FOLIORELAY_DATA_ROOT/control/config/printer.json"
          for _ in $(seq 1 60); do
            if sudo setpriv --reuid=65534 --regid=10001 --clear-groups \
              test -r "$identity"; then
              break
            fi
            sleep 1
          done
          sudo setpriv --reuid=65534 --regid=10001 --clear-groups \
            test -r "$identity"

          sudo setpriv \
            --reuid=65534 --regid=10001 --clear-groups \
            --inh-caps=-all --ambient-caps=-all --bounding-set=-all \
            "$publisher" \
            -identity-file "$identity" \
            -backend avahi \
            -dbus-address unix:path=/run/dbus/system_bus_socket \
            >"$evidence/discovery.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/foliorelay-dnssd.pid"

          testfile="$(find /usr/share/cups -type f -name get-printer-attributes.test -print -quit)"
          test -n "$testfile"
          for _ in $(seq 1 90); do
            control_ok=false
            cups_ok=false
            discovery_ok=false
            curl -fsS http://127.0.0.1:18080/readyz >/dev/null 2>&1 && control_ok=true
            ipptool -tv "$FOLIORELAY_PUBLIC_PRINTER_URI" "$testfile" >"$RUNNER_TEMP/dnssd-ipp.txt" 2>&1 && cups_ok=true
            kill -0 "$(cat "$RUNNER_TEMP/foliorelay-dnssd.pid")" 2>/dev/null && discovery_ok=true
            if [ "$control_ok" = true ] && [ "$cups_ok" = true ] && [ "$discovery_ok" = true ]; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f deploy/mvp/compose.yaml ps
          cat "$evidence/discovery.log" || true
          cat "$RUNNER_TEMP/dnssd-ipp.txt" || true
          exit 1

      - name: Prove product DNS-SD projection matches live CUPS
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/foliorelay-dnssd-evidence"
          mkdir -p "$evidence"
          cp "$RUNNER_TEMP/dnssd-ipp.txt" "$evidence/get-printer-attributes.txt"

          printer_uuid="$(awk '/printer-uuid .* = urn:uuid:/ {print $NF; exit}' "$evidence/get-printer-attributes.txt")"
          urf="$(sed -n 's/.*urf-supported[^=]*= //p' "$evidence/get-printer-attributes.txt" | head -1 | tr -d '\r')"
          test -n "$printer_uuid"
          test -n "$urf"

          found=false
          for _ in $(seq 1 30); do
            timeout 4 avahi-browse -rt _universal._sub._ipp._tcp >"$evidence/avahi-universal.txt" 2>&1 || true
            if grep -Fq 'FolioRelay' "$evidence/avahi-universal.txt" &&
               grep -Fq "hostname = [$FOLIORELAY_PUBLIC_HOST]" "$evidence/avahi-universal.txt" &&
               grep -Fq 'port = [8634]' "$evidence/avahi-universal.txt" &&
               grep -Fq "UUID=${printer_uuid#urn:uuid:}" "$evidence/avahi-universal.txt" &&
               grep -Fq "URF=$urf" "$evidence/avahi-universal.txt" &&
               grep -Fq 'pdl=application/pdf,image/urf' "$evidence/avahi-universal.txt" &&
               grep -Fq 'rp=printers/FolioRelay' "$evidence/avahi-universal.txt"; then
              found=true
              break
            fi
            sleep 1
          done
          if [ "$found" != true ]; then
            docker compose -f deploy/mvp/compose.yaml ps || true
            cat "$evidence/discovery.log" || true
            cat "$evidence/avahi-universal.txt" || true
            exit 1
          fi

          timeout 4 avahi-browse -rt _ipp._tcp >"$evidence/avahi-ipp.txt" 2>&1 || true
          grep -Fq 'FolioRelay' "$evidence/avahi-ipp.txt"
          grep -Fq "UUID=${printer_uuid#urn:uuid:}" "$evidence/avahi-ipp.txt"

          token="$(sudo cat "$FOLIORELAY_TOKEN_FILE")"
          curl -fsS -H "Authorization: Bearer $token"             http://127.0.0.1:18080/api/v1/printer >"$evidence/control-printer.json"
          test "$(jq -r '.identity.printer_uuid' "$evidence/control-printer.json")" = "$printer_uuid"
          test "$(jq -r '.public_uri' "$evidence/control-printer.json")" = "$FOLIORELAY_PUBLIC_PRINTER_URI"

          grep -Fq 'using avahi backend' "$evidence/discovery.log"
          ! grep -Eiq 'fatal|panic|permission denied|address already in use' "$evidence/discovery.log"

      - name: Upload DNS-SD evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: product-airprint-dnssd
          path: ${{ runner.temp }}/foliorelay-dnssd-evidence
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Collect logs and tear down
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/foliorelay-dnssd-evidence"
          if [ -s "$RUNNER_TEMP/foliorelay-dnssd.pid" ]; then
            sudo kill "$(cat "$RUNNER_TEMP/foliorelay-dnssd.pid")" 2>/dev/null || true
          fi
          sudo rm -f "/tmp/foliorelay-dnssd-publisher-${GITHUB_RUN_ID}" || true
          docker compose -f deploy/mvp/compose.yaml ps >"$RUNNER_TEMP/foliorelay-dnssd-evidence/compose-ps.txt" 2>&1 || true
          docker compose -f deploy/mvp/compose.yaml logs >"$RUNNER_TEMP/foliorelay-dnssd-evidence/compose.log" 2>&1 || true
          docker compose -f deploy/mvp/compose.yaml down || true
