name: Managed SMB qualification

on:
  pull_request:
    paths:
      - 'internal/export/**'
      - 'internal/outbox/**'
      - 'internal/qualification/**'
      - 'scripts/ci/qualify-managed-smb.sh'
      - 'tools/qualify-smb-output/**'
      - '.github/workflows/managed-smb-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-smb-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  named-smb-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install disposable Samba fixture dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends samba smbclient acl
      - name: Qualify two permitted SMB users and one denied user
        run: bash scripts/ci/qualify-managed-smb.sh
