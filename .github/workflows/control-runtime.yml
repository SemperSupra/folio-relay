name: FolioRelay Control Runtime

on:
  pull_request:
    paths:
      - 'api/**'
      - 'cmd/foliorelayd/**'
      - 'cmd/foliorelay-probe/**'
      - 'internal/control/**'
      - 'internal/inbox/**'
      - 'internal/printer/**'
      - 'internal/security/**'
      - 'internal/state/**'
      - 'internal/webui/**'
      - 'deploy/control/**'
      - '.github/workflows/control-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-runtime:
    name: control / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Checkout FolioRelay
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build substrate-neutral control image
        shell: bash
        run: |
          set -euo pipefail
          docker build             -f deploy/control/Dockerfile             -t foliorelay-control:test             .
          test "$(docker image inspect -f '{{.Architecture}}' foliorelay-control:test)" = "${{ matrix.arch }}"
          mkdir -p "$RUNNER_TEMP/evidence"
          docker image inspect foliorelay-control:test >"$RUNNER_TEMP/evidence/image-inspect.json"

      - name: Start control runtime with persistent data
        shell: bash
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/foliorelay-data"
          token="$RUNNER_TEMP/foliorelay.token"
          mkdir -p "$data"
          sudo chown 10001:10001 "$data"
          printf '%s\n' '0123456789abcdef0123456789abcdef' >"$token"
          chmod 0444 "$token"

          docker run -d             --name foliorelay-control             --read-only             --tmpfs /tmp:size=16m,mode=1777             --cap-drop ALL             --security-opt no-new-privileges:true             -p 18080:18080             -v "$data:/var/lib/foliorelay"             -v "$token:/run/secrets/foliorelay.token:ro"             foliorelay-control:test               --listen 0.0.0.0:18080               --journal /var/lib/foliorelay/state/journal.frj               --artifact-store /var/lib/foliorelay/artifacts               --token-file /run/secrets/foliorelay.token               --identity-file /var/lib/foliorelay/config/printer.json               --printer-uri ipp://foliorelay.local:8634/printers/FolioRelay

          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:18080/readyz; then
              exit 0
            fi
            sleep 1
          done
          docker logs foliorelay-control >&2 || true
          exit 1

      - name: Prove human and machine control surfaces
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/evidence"
          curl -fsS http://127.0.0.1:18080/ | tee "$evidence/index.html" | grep -q 'FolioRelay'
          curl -fsS http://127.0.0.1:18080/.well-known/foliorelay             | tee "$evidence/capabilities.json" | jq -e '.product == "FolioRelay" and .profiles.windows_ipp == true'

          curl -fsS -c "$RUNNER_TEMP/cookies"             -H 'Content-Type: application/json'             --data '{"token":"0123456789abcdef0123456789abcdef"}'             http://127.0.0.1:18080/auth/session             -o /dev/null

          curl -fsS -b "$RUNNER_TEMP/cookies" http://127.0.0.1:18080/api/v1/printer             | tee "$evidence/printer-before.json"             | jq -e '.public_uri == "ipp://foliorelay.local:8634/printers/FolioRelay"'

          curl -fsS -b "$RUNNER_TEMP/cookies" -X POST http://127.0.0.1:18080/api/v1/self-test             | tee "$evidence/self-test.json"             | jq -e '.status == "warn" and any(.checks[]; .code == "profiles.airprint" and .status == "warn")'

      - name: Prove healthcheck and identity persistence across restart
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/evidence"
          for i in $(seq 1 30); do
            health="$(docker inspect -f '{{.State.Health.Status}}' foliorelay-control)"
            if [ "$health" = healthy ]; then
              break
            fi
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' foliorelay-control)" = healthy

          before="$(jq -r '.identity.printer_uuid' "$evidence/printer-before.json")"
          test -n "$before"

          docker restart foliorelay-control >/dev/null
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:18080/readyz && break
            sleep 1
          done

          curl -fsS -c "$RUNNER_TEMP/cookies-after"             -H 'Content-Type: application/json'             --data '{"token":"0123456789abcdef0123456789abcdef"}'             http://127.0.0.1:18080/auth/session             -o /dev/null
          curl -fsS -b "$RUNNER_TEMP/cookies-after" http://127.0.0.1:18080/api/v1/printer             | tee "$evidence/printer-after.json"

          after="$(jq -r '.identity.printer_uuid' "$evidence/printer-after.json")"
          test "$after" = "$before"

          # Persistence is a black-box product property: the UUID must survive
          # container restart through the mounted data volume. Do not make the
          # hosted runner traverse FolioRelay's intentionally private UID-10001
          # state/config directories as an additional oracle.
          printf '%s\n' "$before" >"$evidence/printer-uuid-before.txt"
          printf '%s\n' "$after" >"$evidence/printer-uuid-after.txt"

      - name: Record runtime surface
        if: always()
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/evidence"
          mkdir -p "$evidence"
          docker inspect foliorelay-control >"$evidence/container-inspect.json" 2>/dev/null || true
          docker logs foliorelay-control >"$evidence/control.log" 2>&1 || true
          if docker image inspect foliorelay-control:test >/dev/null 2>&1; then
            docker image inspect               -f '{{json .Config}}' foliorelay-control:test >"$evidence/image-config.json"
          fi

      - name: Upload control-runtime evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: foliorelay-control-${{ matrix.arch }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Stop control runtime
        if: always()
        shell: bash
        run: docker rm -f foliorelay-control >/dev/null 2>&1 || true
