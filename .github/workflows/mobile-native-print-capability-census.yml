name: Mobile Native Print Capability Census

on:
  pull_request:
    paths:
      - '.github/workflows/mobile-native-print-capability-census.yml'
      - 'experiments/mobile/ios-print-capability/**'
      - 'scripts/mobile/**'
      - 'docs/NATIVE_CLIENT_MATRIX.md'
      - 'contracts/print-substrate-evaluation.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    name: iOS Simulator native print framework
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout FolioRelay
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Census Xcode and simulator print surfaces
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/ios-print-capability"
          mkdir -p "$evidence"

          xcodebuild -version | tee "$evidence/xcode-version.txt"
          xcrun simctl list runtimes -j >"$evidence/runtimes.json"
          xcrun simctl list devicetypes -j >"$evidence/device-types.json"
          xcrun simctl list devices -j >"$evidence/devices.json"
          xcrun --sdk iphonesimulator --show-sdk-path >"$evidence/sdk-path.txt"
          xcrun --sdk iphonesimulator --show-sdk-version >"$evidence/sdk-version.txt"

          sdk="$(cat "$evidence/sdk-path.txt")"
          test -f "$sdk/System/Library/Frameworks/UIKit.framework/Headers/UIPrintInteractionController.h"
          grep -q 'printToPrinter\|print(to:'             "$sdk/System/Library/Frameworks/UIKit.framework/Headers/UIPrintInteractionController.h" || true

          find /Applications -path '*PrinterSimulator.app' -print             >"$evidence/printer-simulator-paths.txt" 2>/dev/null || true

      - name: Build and run UIKit printing capability probe
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/ios-print-capability"
          app="$RUNNER_TEMP/FolioRelayPrintProbe.app"
          mkdir -p "$app"

          read -r runtime udid device_name < <(python3 - "$evidence/runtimes.json" "$evidence/devices.json" <<'PY'
          import json, sys

          runtimes = json.load(open(sys.argv[1])).get("runtimes", [])
          devices = json.load(open(sys.argv[2])).get("devices", {})
          available = {
              r["identifier"]: r
              for r in runtimes
              if r.get("isAvailable") and r.get("platform") == "iOS"
          }

          def version(identifier):
              runtime = available.get(identifier, {})
              return tuple(int(x) for x in runtime.get("version", "0").split("."))

          candidates = []
          for runtime_id, items in devices.items():
              if runtime_id not in available:
                  continue
              for device in items:
                  if (
                      device.get("isAvailable")
                      and "iPhone" in device.get("name", "")
                      and device.get("udid")
                  ):
                      candidates.append((version(runtime_id), runtime_id, device))

          if not candidates:
              raise SystemExit("no compatible available iPhone simulator device/runtime pair")

          _, runtime_id, device = max(candidates, key=lambda item: item[0])
          print(runtime_id, device["udid"], device["name"].replace(" ", "_"))
          PY
          )"

          printf '%s\n' "$runtime" >"$evidence/selected-runtime.txt"
          printf '%s\n' "$device_name" >"$evidence/selected-device-name.txt"
          printf '%s\n' "$udid" >"$evidence/udid.txt"

          cleanup() {
            xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          xcrun simctl boot "$udid" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$udid" -b

          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          arch="$(uname -m)"
          case "$arch" in
            arm64) target="arm64-apple-ios${sdk_version}-simulator" ;;
            x86_64) target="x86_64-apple-ios${sdk_version}-simulator" ;;
            *) echo "unsupported macOS runner architecture: $arch" >&2; exit 1 ;;
          esac

          cp experiments/mobile/ios-print-capability/Info.plist "$app/Info.plist"
          xcrun --sdk iphonesimulator clang             -fobjc-arc -target "$target" -isysroot "$sdk"             -framework UIKit -framework Foundation             experiments/mobile/ios-print-capability/main.m             -o "$app/FolioRelayPrintProbe"
          codesign --force --sign - "$app"

          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" org.sempersupra.foliorelay.printprobe             | tee "$evidence/launch.txt"

          for i in $(seq 1 30); do
            data_container="$(xcrun simctl get_app_container "$udid" org.sempersupra.foliorelay.printprobe data 2>/dev/null || true)"
            if [ -n "$data_container" ] && [ -f "$data_container/Documents/result.json" ]; then
              cp "$data_container/Documents/result.json" "$evidence/result.json"
              break
            fi
            sleep 1
          done
          test -s "$evidence/result.json"
          cat "$evidence/result.json"

      - name: Upload iOS evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ios-simulator-print-capability
          path: ${{ runner.temp }}/ios-print-capability
          if-no-files-found: error
          retention-days: 14

  android-emulator:
    name: Android emulator native print framework
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout FolioRelay
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Boot Android emulator and census real print framework
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 900
          script: bash scripts/mobile/android-print-capability.sh "$RUNNER_TEMP/android-print-capability"

      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: android-emulator-print-capability
          path: ${{ runner.temp }}/android-print-capability
          if-no-files-found: warn
          retention-days: 14
