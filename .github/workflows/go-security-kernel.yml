name: Go Security Kernel

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'internal/**'
      - 'cmd/**'
      - '.github/workflows/go-security-kernel.yml'
  push:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'internal/**'
      - 'cmd/**'
      - '.github/workflows/go-security-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            race: true
          - os: windows-2025
            race: true
          - os: macos-26
            race: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Race tests
        if: matrix.race
        run: go test -race ./...

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Fuzz admission parser
        run: go test ./internal/security -run=^$ -fuzz=FuzzAdmissionBounds -fuzztime=45s

  # Disposable benchmark restricted to the draft 24-case source-only PR.
  paperless_benchmark:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'test/paperless-multilingual-rules-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Pin and start isolated Paperless catalog-version fixture
        shell: bash
        run: |
          set -euo pipefail
          # No TrueNAS, production document, provider token, shared volume or
          # private network resource is used. Both containers are disposable.
          docker network create folio_paperless_ci
          docker run -d --name folio_ci_valkey --network folio_paperless_ci \
            docker.io/valkey/valkey:9-alpine
          pass="$(openssl rand -hex 28)"
          secret="$(openssl rand -hex 42)"
          echo "::add-mask::$pass"
          echo "::add-mask::$secret"
          envfile="$(mktemp)"
          chmod 0600 "$envfile"
          printf '%s\n' \
            "PAPERLESS_REDIS=redis://folio_ci_valkey:6379" \
            "PAPERLESS_DBENGINE=sqlite" \
            "PAPERLESS_SECRET_KEY=$secret" \
            "PAPERLESS_URL=http://127.0.0.1:18080" \
            "PAPERLESS_ADMIN_USER=fixture_admin" \
            "PAPERLESS_ADMIN_PASSWORD=$pass" \
            "PAPERLESS_ADMIN_MAIL=fixture@example.invalid" \
            "PAPERLESS_OCR_LANGUAGE=eng" \
            "PAPERLESS_TASK_WORKERS=1" \
            "PAPERLESS_THREADS_PER_WORKER=2" >"$envfile"
          docker run -d --name folio_ci_paperless --network folio_paperless_ci \
            -p 127.0.0.1:18080:8000 --env-file "$envfile" \
            ghcr.io/paperless-ngx/paperless-ngx:3.1.3
          rm -f "$envfile"
          unset pass secret
          docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/paperless-ngx/paperless-ngx:3.1.3 \
            | tee /tmp/folio-paperless-image.txt
      - name: Qualify real async ingest, readback and duplicate behavior
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 120); do
            if curl -fsS --max-time 3 http://127.0.0.1:18080/api/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Paperless fixture API did not become healthy" >&2
            docker logs --tail 80 folio_ci_paperless | sed -E 's/(password|token|secret)([=: ])[^ ]+/\1\2[REDACTED]/Ig' >&2
            exit 1
          fi
          echo "Paperless API health passed"
          # Only read an ephemeral fixture credential from its own container.
          # API token is never printed, persisted to Git or passed in argv.
          export FOLIO_FIXTURE_PAPERLESS_PASSWORD="$(docker exec folio_ci_paperless printenv PAPERLESS_ADMIN_PASSWORD)"
          export FOLIO_FIXTURE_PAPERLESS_URL="http://127.0.0.1:18080"
          export FOLIO_FIXTURE_PAPERLESS_TOKEN="$(python3 - <<'PY'
          import json,os,urllib.request
          url=os.environ["FOLIO_FIXTURE_PAPERLESS_URL"]+"/api/token/"
          payload=json.dumps({"username":"fixture_admin","password":os.environ["FOLIO_FIXTURE_PAPERLESS_PASSWORD"]}).encode()
          req=urllib.request.Request(url,data=payload,headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=10) as result:
              body=json.load(result)
          token=body.get("token","")
          if len(token)<8:
              raise SystemExit("No Paperless API token")
          print(token,end="")
          PY
          )"
          echo "::add-mask::$FOLIO_FIXTURE_PAPERLESS_TOKEN"
          unset FOLIO_FIXTURE_PAPERLESS_PASSWORD
          go test -tags=paperless_integration ./internal/filing/paperless -run '^TestNativeMultilingualRulesBenchmark$' -count=1 -v
      - name: Fixture cleanup
        if: always()
        shell: bash
        run: |
          docker rm -f folio_ci_paperless folio_ci_valkey >/dev/null 2>&1 || true
          docker network rm folio_paperless_ci >/dev/null 2>&1 || true

  # CPU-only, synthetic local inference; active on this bounded draft PR only.
  paperless_ollama:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'test/paperless-native-ollama-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Pin and start isolated Paperless catalog-version fixture
        shell: bash
        run: |
          set -euo pipefail
          # No TrueNAS, production document, provider token, shared volume or
          # private network resource is used. Both containers are disposable.
          docker network create folio_paperless_ci
          docker run -d --name folio_ci_valkey --network folio_paperless_ci \
            docker.io/valkey/valkey:9-alpine
          # Local CPU model is fetched before testing, no user data/credentials.
          docker run -d --name folio_ci_ollama --network folio_paperless_ci \
            ollama/ollama:0.34.0
          docker exec folio_ci_ollama ollama pull qwen2.5:0.5b-instruct
          docker exec folio_ci_ollama ollama list
          pass="$(openssl rand -hex 28)"
          secret="$(openssl rand -hex 42)"
          echo "::add-mask::$pass"
          echo "::add-mask::$secret"
          envfile="$(mktemp)"
          chmod 0600 "$envfile"
          printf '%s\n' \
            "PAPERLESS_REDIS=redis://folio_ci_valkey:6379" \
            "PAPERLESS_AI_ENABLED=true" \
            "PAPERLESS_AI_LLM_BACKEND=ollama" \
            "PAPERLESS_AI_LLM_ENDPOINT=http://folio_ci_ollama:11434" \
            "PAPERLESS_AI_LLM_MODEL=qwen2.5:0.5b-instruct" \
            "PAPERLESS_AI_LLM_REQUEST_TIMEOUT=180" \
            "PAPERLESS_AI_LLM_ALLOW_INTERNAL_ENDPOINTS=true" \
            "PAPERLESS_DBENGINE=sqlite" \
            "PAPERLESS_SECRET_KEY=$secret" \
            "PAPERLESS_URL=http://127.0.0.1:18080" \
            "PAPERLESS_ADMIN_USER=fixture_admin" \
            "PAPERLESS_ADMIN_PASSWORD=$pass" \
            "PAPERLESS_ADMIN_MAIL=fixture@example.invalid" \
            "PAPERLESS_OCR_LANGUAGE=eng" \
            "PAPERLESS_TASK_WORKERS=1" \
            "PAPERLESS_THREADS_PER_WORKER=2" >"$envfile"
          docker run -d --name folio_ci_paperless --network folio_paperless_ci \
            -p 127.0.0.1:18080:8000 --env-file "$envfile" \
            ghcr.io/paperless-ngx/paperless-ngx:3.1.3
          rm -f "$envfile"
          unset pass secret
          docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/paperless-ngx/paperless-ngx:3.1.3 \
            | tee /tmp/folio-paperless-image.txt
      - name: Qualify local model native-AI suggestions on synthetic records
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 120); do
            if curl -fsS --max-time 3 http://127.0.0.1:18080/api/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Paperless fixture API did not become healthy" >&2
            docker logs --tail 80 folio_ci_paperless | sed -E 's/(password|token|secret)([=: ])[^ ]+/\1\2[REDACTED]/Ig' >&2
            exit 1
          fi
          echo "Paperless API health passed"
          # Only read an ephemeral fixture credential from its own container.
          # API token is never printed, persisted to Git or passed in argv.
          export FOLIO_FIXTURE_PAPERLESS_PASSWORD="$(docker exec folio_ci_paperless printenv PAPERLESS_ADMIN_PASSWORD)"
          export FOLIO_FIXTURE_PAPERLESS_URL="http://127.0.0.1:18080"
          export FOLIO_FIXTURE_PAPERLESS_TOKEN="$(python3 - <<'PY'
          import json,os,urllib.request
          url=os.environ["FOLIO_FIXTURE_PAPERLESS_URL"]+"/api/token/"
          payload=json.dumps({"username":"fixture_admin","password":os.environ["FOLIO_FIXTURE_PAPERLESS_PASSWORD"]}).encode()
          req=urllib.request.Request(url,data=payload,headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=10) as result:
              body=json.load(result)
          token=body.get("token","")
          if len(token)<8:
              raise SystemExit("No Paperless API token")
          print(token,end="")
          PY
          )"
          echo "::add-mask::$FOLIO_FIXTURE_PAPERLESS_TOKEN"
          unset FOLIO_FIXTURE_PAPERLESS_PASSWORD
          go test -tags=paperless_integration ./internal/filing/paperless -run '^TestNativeLocalOllamaSmoke$' -count=1 -v
      - name: Fixture cleanup
        if: always()
        shell: bash
        run: |
          docker rm -f folio_ci_paperless folio_ci_valkey folio_ci_ollama >/dev/null 2>&1 || true
          docker network rm folio_paperless_ci >/dev/null 2>&1 || true

  # Required EN/DE/TH multilingual raster OCR; no user documents or target.
  paperless_required_languages:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'test/paperless-required-en-de-th-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Pin and start isolated Paperless catalog-version fixture
        shell: bash
        run: |
          set -euo pipefail
          # No TrueNAS, production document, provider token, shared volume or
          # private network resource is used. Both containers are disposable.
          docker network create folio_paperless_ci
          docker run -d --name folio_ci_valkey --network folio_paperless_ci \
            docker.io/valkey/valkey:9-alpine
          pass="$(openssl rand -hex 28)"
          secret="$(openssl rand -hex 42)"
          echo "::add-mask::$pass"
          echo "::add-mask::$secret"
          envfile="$(mktemp)"
          chmod 0600 "$envfile"
          printf '%s\n' \
            "PAPERLESS_REDIS=redis://folio_ci_valkey:6379" \
            "PAPERLESS_DBENGINE=sqlite" \
            "PAPERLESS_SECRET_KEY=$secret" \
            "PAPERLESS_URL=http://127.0.0.1:18080" \
            "PAPERLESS_ADMIN_USER=fixture_admin" \
            "PAPERLESS_ADMIN_PASSWORD=$pass" \
            "PAPERLESS_ADMIN_MAIL=fixture@example.invalid" \
            "PAPERLESS_OCR_LANGUAGES=tha" \
            "PAPERLESS_OCR_LANGUAGE=eng+deu+tha" \
            "PAPERLESS_TASK_WORKERS=1" \
            "PAPERLESS_THREADS_PER_WORKER=2" >"$envfile"
          docker run -d --name folio_ci_paperless --network folio_paperless_ci \
            -p 127.0.0.1:18080:8000 --env-file "$envfile" \
            ghcr.io/paperless-ngx/paperless-ngx:3.1.3
          rm -f "$envfile"
          unset pass secret
          docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/paperless-ngx/paperless-ngx:3.1.3 \
            | tee /tmp/folio-paperless-image.txt
      - name: Qualify required languages using real pixels and OCR text
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 120); do
            if curl -fsS --max-time 3 http://127.0.0.1:18080/api/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Paperless fixture API did not become healthy" >&2
            docker logs --tail 80 folio_ci_paperless | sed -E 's/(password|token|secret)([=: ])[^ ]+/\1\2[REDACTED]/Ig' >&2
            exit 1
          fi
          echo "Paperless API health passed"
          # Thai is NOT present in the base Paperless image by default.
          # Fail before ingest if the rootful disposable fixture did not
          # successfully install all three exact traineddata languages.
          langs="$(docker exec folio_ci_paperless tesseract --list-langs 2>/dev/null)"
          for lang in eng deu tha; do
            if ! grep -qx "$lang" <<<"$langs"; then
              echo "missing required OCR traineddata: $lang" >&2
              exit 1
            fi
          done
          echo "Required Tesseract languages installed: eng,deu,tha"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends fonts-noto-core python3-pil fontconfig
          export FOLIO_TRILINGUAL_FIXTURE_DIR="$RUNNER_TEMP/folio-required-ocr"
          /usr/bin/python3 scripts/ci/generate-paperless-en-de-th.py "$FOLIO_TRILINGUAL_FIXTURE_DIR"
          test -s "$FOLIO_TRILINGUAL_FIXTURE_DIR/manifest.json"
          # Only read an ephemeral fixture credential from its own container.
          # API token is never printed, persisted to Git or passed in argv.
          export FOLIO_FIXTURE_PAPERLESS_PASSWORD="$(docker exec folio_ci_paperless printenv PAPERLESS_ADMIN_PASSWORD)"
          export FOLIO_FIXTURE_PAPERLESS_URL="http://127.0.0.1:18080"
          export FOLIO_FIXTURE_PAPERLESS_TOKEN="$(python3 - <<'PY'
          import json,os,urllib.request
          url=os.environ["FOLIO_FIXTURE_PAPERLESS_URL"]+"/api/token/"
          payload=json.dumps({"username":"fixture_admin","password":os.environ["FOLIO_FIXTURE_PAPERLESS_PASSWORD"]}).encode()
          req=urllib.request.Request(url,data=payload,headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=10) as result:
              body=json.load(result)
          token=body.get("token","")
          if len(token)<8:
              raise SystemExit("No Paperless API token")
          print(token,end="")
          PY
          )"
          echo "::add-mask::$FOLIO_FIXTURE_PAPERLESS_TOKEN"
          unset FOLIO_FIXTURE_PAPERLESS_PASSWORD
          go test -tags=paperless_integration ./internal/filing/paperless -run '^TestRequiredEnglishGermanThaiRasterOCR$' -count=1 -v
      - name: Fixture cleanup
        if: always()
        shell: bash
        run: |
          docker rm -f folio_ci_paperless folio_ci_valkey >/dev/null 2>&1 || true
          docker network rm folio_paperless_ci >/dev/null 2>&1 || true

  # Synthetic EN/DE/TH filing quality, no automatic records filing.
  paperless_required_language_filing:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'test/paperless-en-de-th-classification-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Pin and start isolated Paperless catalog-version fixture
        shell: bash
        run: |
          set -euo pipefail
          # No TrueNAS, production document, provider token, shared volume or
          # private network resource is used. Both containers are disposable.
          docker network create folio_paperless_ci
          docker run -d --name folio_ci_valkey --network folio_paperless_ci \
            docker.io/valkey/valkey:9-alpine
          pass="$(openssl rand -hex 28)"
          secret="$(openssl rand -hex 42)"
          echo "::add-mask::$pass"
          echo "::add-mask::$secret"
          envfile="$(mktemp)"
          chmod 0600 "$envfile"
          printf '%s\n' \
            "PAPERLESS_REDIS=redis://folio_ci_valkey:6379" \
            "PAPERLESS_DBENGINE=sqlite" \
            "PAPERLESS_SECRET_KEY=$secret" \
            "PAPERLESS_URL=http://127.0.0.1:18080" \
            "PAPERLESS_ADMIN_USER=fixture_admin" \
            "PAPERLESS_ADMIN_PASSWORD=$pass" \
            "PAPERLESS_ADMIN_MAIL=fixture@example.invalid" \
            "PAPERLESS_OCR_LANGUAGES=tha" \
            "PAPERLESS_OCR_LANGUAGE=eng+deu+tha" \
            "PAPERLESS_TASK_WORKERS=1" \
            "PAPERLESS_THREADS_PER_WORKER=2" >"$envfile"
          docker run -d --name folio_ci_paperless --network folio_paperless_ci \
            -p 127.0.0.1:18080:8000 --env-file "$envfile" \
            ghcr.io/paperless-ngx/paperless-ngx:3.1.3
          rm -f "$envfile"
          unset pass secret
          docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/paperless-ngx/paperless-ngx:3.1.3 \
            | tee /tmp/folio-paperless-image.txt
      - name: Measure six native record types and contradictions per language
        shell: bash
        timeout-minutes: 28
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 120); do
            if curl -fsS --max-time 3 http://127.0.0.1:18080/api/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Paperless fixture API did not become healthy" >&2
            docker logs --tail 80 folio_ci_paperless | sed -E 's/(password|token|secret)([=: ])[^ ]+/\1\2[REDACTED]/Ig' >&2
            exit 1
          fi
          echo "Paperless API health passed"
          # Thai is NOT present in the base Paperless image by default.
          # Fail before ingest if the rootful disposable fixture did not
          # successfully install all three exact traineddata languages.
          langs="$(docker exec folio_ci_paperless tesseract --list-langs 2>/dev/null)"
          for lang in eng deu tha; do
            if ! grep -qx "$lang" <<<"$langs"; then
              echo "missing required OCR traineddata: $lang" >&2
              exit 1
            fi
          done
          echo "Required Tesseract languages installed: eng,deu,tha"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends fonts-noto-core python3-pil fontconfig
          export FOLIO_TRILINGUAL_FIXTURE_DIR="$RUNNER_TEMP/folio-required-ocr"
          /usr/bin/python3 scripts/ci/generate-paperless-en-de-th.py "$FOLIO_TRILINGUAL_FIXTURE_DIR"
          test -s "$FOLIO_TRILINGUAL_FIXTURE_DIR/manifest.json"
          # Only read an ephemeral fixture credential from its own container.
          # API token is never printed, persisted to Git or passed in argv.
          export FOLIO_FIXTURE_PAPERLESS_PASSWORD="$(docker exec folio_ci_paperless printenv PAPERLESS_ADMIN_PASSWORD)"
          export FOLIO_FIXTURE_PAPERLESS_URL="http://127.0.0.1:18080"
          export FOLIO_FIXTURE_PAPERLESS_TOKEN="$(python3 - <<'PY'
          import json,os,urllib.request
          url=os.environ["FOLIO_FIXTURE_PAPERLESS_URL"]+"/api/token/"
          payload=json.dumps({"username":"fixture_admin","password":os.environ["FOLIO_FIXTURE_PAPERLESS_PASSWORD"]}).encode()
          req=urllib.request.Request(url,data=payload,headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=10) as result:
              body=json.load(result)
          token=body.get("token","")
          if len(token)<8:
              raise SystemExit("No Paperless API token")
          print(token,end="")
          PY
          )"
          echo "::add-mask::$FOLIO_FIXTURE_PAPERLESS_TOKEN"
          unset FOLIO_FIXTURE_PAPERLESS_PASSWORD
          go test -tags=paperless_integration ./internal/filing/paperless -run '^TestRequiredTrilingualFilingQuality$' -count=1 -v
      - name: Fixture cleanup
        if: always()
        shell: bash
        run: |
          docker rm -f folio_ci_paperless folio_ci_valkey >/dev/null 2>&1 || true
          docker network rm folio_paperless_ci >/dev/null 2>&1 || true

  # Source-only OCR DoE. Direct Tesseract results must not be conflated with
  # complete Paperless OCRmyPDF ingest, native AI, or authorized filing.
  thai_ocr_sweep:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'test/paperless-thai-ocr-parameter-sweep-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install public Tesseract language packs and synthetic renderer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu tesseract-ocr-tha \
            fonts-noto-core python3-pil fontconfig
          tesseract --version
          languages="$(tesseract --list-langs 2>/dev/null)"
          for lang in eng deu tha; do
            grep -qx "$lang" <<<"$languages" || { echo "missing $lang" >&2; exit 1; }
          done
          /usr/bin/python3 -m py_compile scripts/ci/generate-paperless-en-de-th.py scripts/ci/qualify-thai-tesseract-sweep.py
      - name: Generate synthetic Thai scanned documents and compare language-order/PSM
        shell: bash
        timeout-minutes: 18
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/foliorelay-thai-ocr-doe"
          /usr/bin/python3 scripts/ci/generate-paperless-en-de-th.py "$output"
          /usr/bin/python3 scripts/ci/qualify-thai-tesseract-sweep.py "$output"

  # Synthetic-only cross-stage Thai text-path isolation.
  paperless_text_path:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'test/paperless-thai-text-path-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Pin and start isolated Paperless catalog-version fixture
        shell: bash
        run: |
          set -euo pipefail
          # No TrueNAS, production document, provider token, shared volume or
          # private network resource is used. Both containers are disposable.
          docker network create folio_paperless_ci
          docker run -d --name folio_ci_valkey --network folio_paperless_ci \
            docker.io/valkey/valkey:9-alpine
          pass="$(openssl rand -hex 28)"
          secret="$(openssl rand -hex 42)"
          echo "::add-mask::$pass"
          echo "::add-mask::$secret"
          envfile="$(mktemp)"
          chmod 0600 "$envfile"
          printf '%s\n' \
            "PAPERLESS_REDIS=redis://folio_ci_valkey:6379" \
            "PAPERLESS_DBENGINE=sqlite" \
            "PAPERLESS_SECRET_KEY=$secret" \
            "PAPERLESS_URL=http://127.0.0.1:18080" \
            "PAPERLESS_ADMIN_USER=fixture_admin" \
            "PAPERLESS_ADMIN_PASSWORD=$pass" \
            "PAPERLESS_ADMIN_MAIL=fixture@example.invalid" \
            "PAPERLESS_OCR_LANGUAGES=tha" \
            "PAPERLESS_OCR_LANGUAGE=eng+deu+tha" \
            "PAPERLESS_TASK_WORKERS=1" \
            "PAPERLESS_THREADS_PER_WORKER=2" >"$envfile"
          docker run -d --name folio_ci_paperless --network folio_paperless_ci \
            -p 127.0.0.1:18080:8000 --env-file "$envfile" \
            ghcr.io/paperless-ngx/paperless-ngx:3.1.3
          rm -f "$envfile"
          unset pass secret
          docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/paperless-ngx/paperless-ngx:3.1.3 \
            | tee /tmp/folio-paperless-image.txt
      - name: Compare Tesseract sidecar PDF and Paperless text channels
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 120); do
            if curl -fsS --max-time 3 http://127.0.0.1:18080/api/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Paperless fixture API did not become healthy" >&2
            docker logs --tail 80 folio_ci_paperless | sed -E 's/(password|token|secret)([=: ])[^ ]+/\1\2[REDACTED]/Ig' >&2
            exit 1
          fi
          echo "Paperless API health passed"
          # Thai is NOT present in the base Paperless image by default.
          # Fail before ingest if the rootful disposable fixture did not
          # successfully install all three exact traineddata languages.
          langs="$(docker exec folio_ci_paperless tesseract --list-langs 2>/dev/null)"
          for lang in eng deu tha; do
            if ! grep -qx "$lang" <<<"$langs"; then
              echo "missing required OCR traineddata: $lang" >&2
              exit 1
            fi
          done
          echo "Required Tesseract languages installed: eng,deu,tha"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends fonts-noto-core python3-pil fontconfig
          export FOLIO_TRILINGUAL_FIXTURE_DIR="$RUNNER_TEMP/folio-required-ocr"
          /usr/bin/python3 scripts/ci/generate-paperless-en-de-th.py "$FOLIO_TRILINGUAL_FIXTURE_DIR"
          test -s "$FOLIO_TRILINGUAL_FIXTURE_DIR/manifest.json"
          # Only read an ephemeral fixture credential from its own container.
          # API token is never printed, persisted to Git or passed in argv.
          export FOLIO_FIXTURE_PAPERLESS_PASSWORD="$(docker exec folio_ci_paperless printenv PAPERLESS_ADMIN_PASSWORD)"
          export FOLIO_FIXTURE_PAPERLESS_URL="http://127.0.0.1:18080"
          export FOLIO_FIXTURE_PAPERLESS_TOKEN="$(python3 - <<'PY'
          import json,os,urllib.request
          url=os.environ["FOLIO_FIXTURE_PAPERLESS_URL"]+"/api/token/"
          payload=json.dumps({"username":"fixture_admin","password":os.environ["FOLIO_FIXTURE_PAPERLESS_PASSWORD"]}).encode()
          req=urllib.request.Request(url,data=payload,headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=10) as result:
              body=json.load(result)
          token=body.get("token","")
          if len(token)<8:
              raise SystemExit("No Paperless API token")
          print(token,end="")
          PY
          )"
          echo "::add-mask::$FOLIO_FIXTURE_PAPERLESS_TOKEN"
          unset FOLIO_FIXTURE_PAPERLESS_PASSWORD
          /usr/bin/python3 scripts/ci/inspect-paperless-thai-text-path.py "$FOLIO_TRILINGUAL_FIXTURE_DIR"
      - name: Fixture cleanup
        if: always()
        shell: bash
        run: |
          docker rm -f folio_ci_paperless folio_ci_valkey >/dev/null 2>&1 || true
          docker network rm folio_paperless_ci >/dev/null 2>&1 || true

  # Controlled OCR model comparison; all blobs are Git-blob pinned and checksummed.
  thai_traineddata_ab:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'test/paperless-thai-traineddata-ab-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare verified language-model alternatives
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu tesseract-ocr-tha \
            fonts-noto-core python3-pil fontconfig
          tesseract --version
          sysdir="$(dirname "$(find /usr/share/tesseract-ocr -name eng.traineddata -print -quit)")"
          test -s "$sysdir/deu.traineddata" && test -s "$sysdir/tha.traineddata"
          for mode in ubuntu_packaged tessdata_best tessdata_fast; do
            mkdir -p "$RUNNER_TEMP/folio-thai-models/$mode"
            cp "$sysdir/eng.traineddata" "$sysdir/deu.traineddata" \
               "$RUNNER_TEMP/folio-thai-models/$mode/"
          done
          cp "$sysdir/tha.traineddata" "$RUNNER_TEMP/folio-thai-models/ubuntu_packaged/"
          # Immutable upstream commits plus exact Git blob identity, not a
          # mutable 'main' tag or unverified model-provider response.
          curl --fail --silent --show-error --location --retry 2 \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/e12c65a915945e4c28e237a9b52bc4a8f39a0cec/tha.traineddata \
            -o "$RUNNER_TEMP/folio-thai-models/tessdata_best/tha.traineddata"
          curl --fail --silent --show-error --location --retry 2 \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/tha.traineddata \
            -o "$RUNNER_TEMP/folio-thai-models/tessdata_fast/tha.traineddata"
          test "$(git hash-object "$RUNNER_TEMP/folio-thai-models/tessdata_best/tha.traineddata")" = \
            "b975c85f60f82febe6f8c5a52a3eb74f3ceb01b9"
          test "$(git hash-object "$RUNNER_TEMP/folio-thai-models/tessdata_fast/tha.traineddata")" = \
            "ea28de3985668cac00d261c5b91f023ea66e19cd"
          for mode in ubuntu_packaged tessdata_best tessdata_fast; do
            langs="$(tesseract --list-langs --tessdata-dir "$RUNNER_TEMP/folio-thai-models/$mode" 2>/dev/null)"
            for lang in eng deu tha; do
              grep -qx "$lang" <<<"$langs" || { echo "missing $lang in $mode" >&2; exit 1; }
            done
          done
          /usr/bin/python3 -m py_compile scripts/ci/generate-paperless-en-de-th.py scripts/ci/qualify-thai-tesseract-sweep.py scripts/ci/compare-thai-traineddata.py
      - name: Compare pinned best fast and packaged Thai OCR on nine synthetic scans
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/folio-thai-corpus"
          /usr/bin/python3 scripts/ci/generate-paperless-en-de-th.py "$root"
          /usr/bin/python3 scripts/ci/compare-thai-traineddata.py "$root" \
            "$RUNNER_TEMP/folio-thai-models/ubuntu_packaged" \
            "$RUNNER_TEMP/folio-thai-models/tessdata_best" \
            "$RUNNER_TEMP/folio-thai-models/tessdata_fast"
