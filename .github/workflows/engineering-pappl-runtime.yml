name: Engineering PAPPL Runtime (archived reference)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout FolioRelay
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install native IPP client dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cups-ipp-utils libcups2-dev curl

      - name: Build and start engineering runtime
        run: |
          docker compose -f deploy/engineering-pappl/compose.yaml up -d --build

      - name: Wait for state authority and printer
        run: |
          set -euo pipefail
          testfile="$(find /usr/share/cups -type f -name get-printer-attributes.test -print -quit)"
          test -n "$testfile"

          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:18081/health && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:18081/health

          for i in $(seq 1 60); do
            ipptool -q ipp://127.0.0.1:8633/ipp/print "$testfile" && break
            sleep 1
          done
          ipptool -q ipp://127.0.0.1:8633/ipp/print "$testfile"

      - name: Prove packaged runtime hardening
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/engineering-pappl-runtime"

          for service in state pappl; do
            cid="$(docker compose -f deploy/engineering-pappl/compose.yaml ps -q "$service")"
            test -n "$cid"
            docker inspect "$cid" >"$RUNNER_TEMP/engineering-pappl-runtime/$service-inspect.json"

            test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$cid")" = "true"
            docker inspect -f '{{json .HostConfig.CapDrop}}' "$cid" | grep -q '"ALL"'
            docker inspect -f '{{json .HostConfig.SecurityOpt}}' "$cid" | grep -q 'no-new-privileges'

            uid="$(docker compose -f deploy/engineering-pappl/compose.yaml exec -T "$service" id -u)"
            test "$uid" = "10001"

            if docker compose -f deploy/engineering-pappl/compose.yaml exec -T "$service" \
                sh -c 'touch /root/foliorelay-rootfs-write-probe' 2>/dev/null; then
              echo "$service unexpectedly wrote to the read-only root filesystem" >&2
              exit 1
            fi
          done

          docker compose -f deploy/engineering-pappl/compose.yaml exec -T state \
            sh -c 'test -w /state && test ! -w /etc'
          docker compose -f deploy/engineering-pappl/compose.yaml exec -T pappl \
            sh -c 'test -w /var/lib/pappl && test -w /var/lib/foliorelay-artifacts && \
                   test -w /tmp && test ! -w /etc'

      - name: Print through the packaged runtime
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/sample.pdf" <<'PDF'
          %PDF-1.1
          1 0 obj
          << /Type /Catalog /Pages 2 0 R >>
          endobj
          2 0 obj
          << /Type /Pages /Kids [3 0 R] /Count 1 >>
          endobj
          3 0 obj
          << /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] >>
          endobj
          trailer
          << /Root 1 0 R >>
          %%EOF
          PDF

          printtest="$(find /usr/share/cups -type f -name print-job.test -print -quit)"
          test -n "$printtest"
          ipptool -q -f "$RUNNER_TEMP/sample.pdf" \
            ipp://127.0.0.1:8633/ipp/print "$printtest"

          for i in $(seq 1 30); do
            stats="$(curl -fsS http://127.0.0.1:18081/v1/stats)"
            accepted="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["accepted"])' <<<"$stats")"
            [ "$accepted" -ge 1 ] && break
            sleep 1
          done
          stats="$(curl -fsS http://127.0.0.1:18081/v1/stats)"
          python3 - "$stats" <<'PY'
          import json, sys
          stats=json.loads(sys.argv[1])
          assert stats["accepted"] >= 1, stats
          assert stats["conflicts"] == 0, stats
          PY

          docker compose -f deploy/engineering-pappl/compose.yaml exec -T pappl \
            sh -c 'find /var/lib/foliorelay-artifacts/sha256 -type f -print -quit | grep -q .'

      - name: Prove Linux native libcups direct client path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/engineering-pappl-runtime"
          cc -O2 -Wall -Wextra \
            $(cups-config --cflags) \
            -o "$RUNNER_TEMP/foliorelay-native-libcups-client" \
            experiments/print-substrate/native-libcups-client.c \
            $(cups-config --ldflags) $(cups-config --libs)

          python3 scripts/make-probe-pdf.py "$RUNNER_TEMP/linux-native-client.pdf"
          file "$RUNNER_TEMP/linux-native-client.pdf" \
            | tee "$RUNNER_TEMP/engineering-pappl-runtime/linux-native-libcups-pdf-file.txt"
          dpkg-query -W libcups2 libcups2-dev \
            | tee "$RUNNER_TEMP/engineering-pappl-runtime/linux-native-libcups-packages.txt"

          before="$(curl -fsS http://127.0.0.1:18081/v1/stats)"
          "$RUNNER_TEMP/foliorelay-native-libcups-client" \
            ipp://127.0.0.1:8633/ipp/print "$RUNNER_TEMP/linux-native-client.pdf" \
            | tee "$RUNNER_TEMP/engineering-pappl-runtime/linux-native-libcups-submit.txt"

          for i in $(seq 1 30); do
            after="$(curl -fsS http://127.0.0.1:18081/v1/stats)"
            b="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["accepted"])' <<<"$before")"
            a="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["accepted"])' <<<"$after")"
            [ "$a" -gt "$b" ] && break
            sleep 1
          done

          after="$(curl -fsS http://127.0.0.1:18081/v1/stats)"
          python3 - "$before" "$after" <<'PY'
          import json, sys
          before=json.loads(sys.argv[1])
          after=json.loads(sys.argv[2])
          assert after["accepted"] > before["accepted"], (before, after)
          assert after["conflicts"] == before["conflicts"], (before, after)
          PY
          printf '%s\n' "$before" >"$RUNNER_TEMP/engineering-pappl-runtime/linux-native-libcups-before.json"
          printf '%s\n' "$after" >"$RUNNER_TEMP/engineering-pappl-runtime/linux-native-libcups-after.json"

      - name: Prove restart preserves identity epoch and job continuity
        run: |
          set -euo pipefail
          before="$(curl -fsS http://127.0.0.1:18081/v1/stats)"
          instance_before="$(docker compose -f deploy/engineering-pappl/compose.yaml exec -T pappl \
            cat /var/lib/pappl/foliorelay-substrate-instance | tr -d '\r\n')"
          test -n "$instance_before"

          cat >"$RUNNER_TEMP/sample-after-restart.pdf" <<'PDF'
          %PDF-1.1
          % FolioRelay restart-continuity probe with distinct bytes
          1 0 obj
          << /Type /Catalog /Pages 2 0 R >>
          endobj
          2 0 obj
          << /Type /Pages /Kids [3 0 R] /Count 1 >>
          endobj
          3 0 obj
          << /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] >>
          endobj
          trailer
          << /Root 1 0 R >>
          %%EOF
          PDF

          docker compose -f deploy/engineering-pappl/compose.yaml restart pappl

          testfile="$(find /usr/share/cups -type f -name get-printer-attributes.test -print -quit)"
          for i in $(seq 1 60); do
            ipptool -q ipp://127.0.0.1:8633/ipp/print "$testfile" && break
            sleep 1
          done
          ipptool -q ipp://127.0.0.1:8633/ipp/print "$testfile"

          instance_after="$(docker compose -f deploy/engineering-pappl/compose.yaml exec -T pappl \
            cat /var/lib/pappl/foliorelay-substrate-instance | tr -d '\r\n')"
          test "$instance_after" = "$instance_before"

          printtest="$(find /usr/share/cups -type f -name print-job.test -print -quit)"
          ipptool -q -f "$RUNNER_TEMP/sample-after-restart.pdf" \
            ipp://127.0.0.1:8633/ipp/print "$printtest"

          for i in $(seq 1 30); do
            after="$(curl -fsS http://127.0.0.1:18081/v1/stats)"
            b="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["accepted"])' <<<"$before")"
            a="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["accepted"])' <<<"$after")"
            [ "$a" -gt "$b" ] && break
            sleep 1
          done

          after="$(curl -fsS http://127.0.0.1:18081/v1/stats)"
          python3 - "$before" "$after" <<'PY'
          import json, sys
          before=json.loads(sys.argv[1])
          after=json.loads(sys.argv[2])
          assert after["accepted"] > before["accepted"], (before, after)
          assert after["conflicts"] == before["conflicts"], (before, after)
          PY

          printf '%s\n' "$instance_before" >"$RUNNER_TEMP/engineering-pappl-runtime/substrate-instance.txt"
          printf '%s\n' "$before" >"$RUNNER_TEMP/engineering-pappl-runtime/pre-restart-stats.json"
          printf '%s\n' "$after" >"$RUNNER_TEMP/engineering-pappl-runtime/post-restart-stats.json"

      - name: Measure packaged PAPPL runtime surface
        run: |
          bash scripts/measure-runtime-surface.sh \
            deploy/engineering-pappl/compose.yaml \
            pappl \
            "$RUNNER_TEMP/engineering-pappl-runtime/surface" \
            /usr/local/bin/foliorelay-pappl-ingress

      - name: Measure PAPPL integration maintenance surface
        run: |
          python3 scripts/measure-selection-maintenance.py \
            pappl \
            "$RUNNER_TEMP/engineering-pappl-runtime/selection-maintenance.json"

      - name: Measure packaged PAPPL restart-to-ready latency
        run: |
          bash scripts/measure-runtime-startup.sh \
            deploy/engineering-pappl/compose.yaml \
            pappl \
            ipp://127.0.0.1:8633/ipp/print \
            "$RUNNER_TEMP/engineering-pappl-runtime/behavior" \
            3

      - name: Capture logs and runtime surface
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/engineering-pappl-runtime"
          docker compose -f deploy/engineering-pappl/compose.yaml ps -a \
            >"$RUNNER_TEMP/engineering-pappl-runtime/ps.txt" || true
          docker compose -f deploy/engineering-pappl/compose.yaml logs --no-color \
            >"$RUNNER_TEMP/engineering-pappl-runtime/logs.txt" 2>&1 || true
          docker compose -f deploy/engineering-pappl/compose.yaml exec -T pappl \
            sh -c 'cat /usr/share/foliorelay/pappl-runtime.ldd; echo; \
                   find /var/lib/pappl -maxdepth 3 -type f -printf "%p %s\n" | sort' \
            >"$RUNNER_TEMP/engineering-pappl-runtime/runtime-surface.txt" 2>&1 || true
          curl -fsS http://127.0.0.1:18081/v1/stats \
            >"$RUNNER_TEMP/engineering-pappl-runtime/stats.json" || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: engineering-pappl-runtime
          path: ${{ runner.temp }}/engineering-pappl-runtime
          if-no-files-found: warn
          retention-days: 14

      - name: Stop runtime
        if: always()
        run: |
          docker compose -f deploy/engineering-pappl/compose.yaml down || true
