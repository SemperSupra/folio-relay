      cap_drop_all: pass
      no_new_privileges: pass
      explicit_writable_paths: pass
      source_identity_restart_continuity: pass
      projection_state_load_failure: fail-closed
    production_status: archived-reference
    retained_role: future-printer-application-and-interoperability-reference
    automatic_qualification: disabled
    concurrency_observations:
      - clients: 25
        requests_per_client: 100
        status: pass
        errors: 0
