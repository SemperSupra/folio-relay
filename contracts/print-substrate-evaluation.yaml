schema_version: 3
product: FolioRelay
experiment: print-substrate-bakeoff
autonomous: true
user_manual_steps: prohibited

sources:
  cups:
    repository: OpenPrinting/cups
    version: v2.4.19
    annotated_tag_object: f095f335b55607ae7ab7fdf9291113da81264959
    commit: 6ba0487abb05afc93d639f37676add8fd65d3756
  ippeveprinter:
    repository: OpenPrinting/cups
    version: v2.4.19
    annotated_tag_object: f095f335b55607ae7ab7fdf9291113da81264959
    commit: 6ba0487abb05afc93d639f37676add8fd65d3756
  pappl:
    repository: michaelrsweet/pappl
    version: v1.4.12
    annotated_tag_object: 4f6a8d87dde5ab99d33abe172f767e6db1beb20d
    commit: 6db8e137557ad84662e78d24fdb2a591c621f4ac

supply_chain_inputs:
  ubuntu_base: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
  golang_base: golang:1.27.1-bookworm@sha256:69a7b9788769bec032d238959b61854e9ae87f57be9029ec04e9885fabf99195
  ubuntu_archive_snapshot: 20260928T000000Z
  source_checkout_by_commit: required
  floating_source_tag_checkout: prohibited
  mutable_apt_latest_resolution: prohibited
  qualification_status: pass
  release_tag_authority_verified: pass
  pinned_base_resolution: pass
  pinned_ubuntu_snapshot_resolution: pass
  repeated_no_cache_builds: pass
  repeated_package_manifest_match:
    cups-minimal: pass
    pappl: pass
  repeated_key_binary_hash_match:
    cups-minimal: pass
    pappl: pass
  repeated_image_size_match:
    cups-minimal:
      status: pass
      bytes: 90321940
    pappl:
      status: pass
      bytes: 90328920
  upstream_update_rehearsal:
    candidate: pappl
    from_version: v1.4.11
    from_commit: ad86a0a8473f0f83233a374226561181570d4f81
    to_version: v1.4.12
    to_commit: 6db8e137557ad84662e78d24fdb2a591c621f4ac
    release_published: 2026-08-20
    reason: upstream bug-fix release with overflow-protection and error/locking fixes
    qualification_status: pass

candidates:
  cups-minimal:
    hypothesis: general scheduler can be sufficiently subordinated and stripped
    permanent_fork_allowed: false
    phase0: pass
    phase1: pass
    upstream_scheduler_suite: pass
    tls: pass
    discovery_profile: pass
    least_privilege: pass
    ipp_everywhere_engineering_conformance: pass
    packaged_engineering_runtime:
      runnable: pass
      read_only_root: pass
      cap_drop_all: pass
      no_new_privileges: pass
      explicit_writable_paths: pass
    production_status: active-candidate
    authority_outage_policy:
      upstream_error_policy: retry-job
      qualification_retry_interval_seconds: 1
      qualification_retry_limit: 10
      rationale: fail closed during authority outage without permanently stopping the virtual queue

  ippeveprinter:
    hypothesis: simple upstream IPP Everywhere server is sufficient as ingress
    permanent_fork_allowed: false
    phase0: pass
    production_status: vetoed
    retained_role: interoperability-and-protocol-oracle
    veto_reasons:
      - upstream implementation explicitly accepts only one active job at a time
      - concurrent bursts return IPP server-error-busy while another job is printing
      - adding a queue or patching upstream would defeat the no-fork/minimal-substrate objective
    concurrency_observations:
      - attempts: 100
        accepted: 6
        rejected_or_failed: 94
        observed_status: server-error-busy
      - attempts: 100
        accepted: 8
        rejected_or_failed: 92
        observed_status: server-error-busy

  pappl:
    hypothesis: production-oriented IPP framework can be constrained to a narrow adapter
    permanent_fork_allowed: false
    phase0: pass
    phase1: pass
    tls: pass
    discovery_profile: pass
    least_privilege: pass
    ipp_everywhere_engineering_conformance: pass
    packaged_engineering_runtime:
      runnable: pass
      read_only_root: pass
      cap_drop_all: pass
      no_new_privileges: pass
      explicit_writable_paths: pass
      source_identity_restart_continuity: pass
      projection_state_load_failure: fail-closed
    production_status: active-candidate
    concurrency_observations:
      - clients: 25
        requests_per_client: 100
        status: pass
        errors: 0
      - clients: 100
        requests_per_client: 100
        status: pass
        errors: 0
      - clients: 250
        requests_per_client: 100
        status: pass
        errors: 0
      - clients: 500
        requests_per_client: 20
        status: pass
        errors: 0
      - clients: 100
        requests_per_client: 1000
        status: characterization-degraded
        observed_errors:
          - 7
          - 12
        note: repeated long-run observations vary and require root-cause characterization


operating_envelope:
  interpretation:
    measured_throughput_is_characterization_not_capacity_limit: true
    passing_concurrency_is_minimum_proven_envelope_not_capacity_claim: true
    github_hosted_runner_results_are_not_production_sizing: true
  qualified_gates:
    real_print_job_concurrency:
      cups-minimal:
        concurrent_submissions: 25
        status: pass
      pappl:
        concurrent_submissions: 25
        status: pass
    pappl_minimal_external_client_pressure:
      - clients: 100
        requests_per_client: 100
        failed_clients: 0
        timed_out_clients: 0
        status: pass
      - clients: 100
        requests_per_client: 1000
        failed_clients: 0
        timed_out_clients: 0
        status: pass
    authority_outage:
      cups-minimal: pass
      pappl: pass
    cancellation_status_projection:
      cups-minimal: pass
      pappl: pass
    malformed_and_slow_client_resilience:
      cups-minimal: pass
      pappl: pass
    abusive_copy_admission:
      cups-minimal: pass
      pappl: pass
    bounded_spool_exhaustion:
      cups-minimal: pass
      pappl: pass
      fixture_bytes: 2097152
      invariant: substrate exhaustion does not advance durable accepted state or take down the state authority
    architecture_build_smoke:
      cups-minimal:
        amd64: pass
        arm64: pass
      pappl:
        amd64: pass
        arm64: pass
    tls:
      cups-minimal: pass
      pappl: pass
    dns_sd_discovery:
      cups-minimal: pass
      pappl: pass
    least_privilege:
      cups-minimal: pass
      pappl: pass
    ipp_everywhere_engineering_conformance:
      cups-minimal: pass
      pappl: pass
    linux_native_libcups_direct_print_job:
      cups-minimal: pass
      pappl: pass
      client_library: ubuntu-24.04-libcups-2.4.7
      operation: Print-Job
      observed_status: successful-ok
      note: direct native client bypasses unrelated local scheduler/filter conversion
    upstream_security_update_path:
      status: pass
      rehearsal: pappl-v1.4.11-to-v1.4.12
    packaged_runtime_surface:
      normalized_against_pinned_minimal_libcups: true
      immutable_input_tuple: true
      cups-minimal:
        image_size_bytes: 90321940
        rootfs_accessible_file_count: 2745
        rootfs_accessible_file_bytes: 93324056
        executable_file_count: 507
        executable_file_bytes: 41583958
        package_count: 94
        package_installed_size_kib: 96801
        measured_dynamic_dependency_count: 8
      pappl:
        image_size_bytes: 90328920
        rootfs_accessible_file_count: 2756
        rootfs_accessible_file_bytes: 93324474
        executable_file_count: 505
        executable_file_bytes: 40761702
        package_count: 96
        package_installed_size_kib: 97719
        measured_dynamic_dependency_count: 9
      interpretation: characterization-only-not-selection
  hard_product_limits:
    artifact_bytes: 104857600
    copies_per_job: 1000
    state_journal_record_bytes: 4194304
    substrate_spool: deployment-bounded-separate-filesystem

client_oracle_findings:
  ubuntu_local_everywhere_queue:
    status: non-candidate-specific-host-filter-defect
    affected_candidates:
      - cups-minimal
      - pappl
    observed_failure: cups-filters universal process signal-11 before IPP transport
    valid_pdf_reproduced: true
    admission_gate: false
    retained_as_negative_space_evidence: true

flow_control:
  throttle_basis: resource-budget-and-work-pressure
  throughput_rps_limit_derived_from_ci_measurement: prohibited
  admission:
    hard_budget_exhaustion: retryable-backpressure-before-durable-accept
    permanent_policy_violation: resource-rejected
    backpressure_consumes_idempotency_key: false
    backpressure_creates_effect_intent: false
  retries:
    finite_budget_required: true
    stable_identity_preserved: true
    unbounded_retry: prohibited
  observability:
    structured_warning_events: required
    external_event_bus: optional
    warning_delivery_required_for_correctness: false
    rate_limited: true
    recommended_signals:
      - substrate_spool_utilization
      - durable_store_free_capacity
      - pending_or_active_work
      - oldest_pending_age
      - state_authority_unavailable
      - retry_budget_consumption
      - resource_rejections
      - idempotency_conflicts
      - journal_fsync_latency

platform_client_matrix:
  linux_ubuntu_24_04:
    native_client: libcups-direct-print-job
    cups-minimal: pass
    pappl: pass
  macos_15:
    status: capability-interview-pass
    mutation_allowed: false
    observed:
      cups_scheduler_running: true
      lp_lpadmin_lpstat: present
      ippfind_ipptool: present
      cups_config: present
      dns_sd: present
      cups_sdk_header_link_probe: pass
    next_rep:
      candidate: pappl
      native_path: system-cups-lpadmin-everywhere-plus-lp
      status: in-progress
  windows_2025:
    status: capability-interview-pass
    mutation_allowed: false
    observed:
      spooler: running
      print_management_module: present
      add_printer: present
      msft_printer_cim_class: present
      microsoft_ipp_class_driver: present
    next_rep:
      status: candidate-host-strategy-required
  android:
    status: unqualified
    requirement: faithful-native-print-service-path
  ios_ipados:
    status: unqualified
    requirement: faithful-airprint-path
  synthetic_protocol_client_can_substitute_for_native_path: false

veto_gates:
  - native_ipp_interoperability
  - ipp_everywhere_engineering_conformance
  - canonical_artifact_handoff
  - stable_job_effect_correlation
  - bounded_concurrency
  - bounded_input_resources
  - crash_restart_safety
  - no_duplicate_effects
  - tls
  - discovery_when_enabled
  - least_privilege
  - malformed_request_resilience
  - no_competing_durable_authority
  - amd64
  - arm64
  - upstream_security_update_path

metrics:
  - executable_bytes
  - runtime_dependency_bytes
  - dynamic_library_count
  - executable_count
  - package_count
  - cve_surface
  - startup_latency
  - idle_rss
  - loaded_rss
  - throughput
  - concurrent_clients
  - capabilities
  - writable_paths
  - listening_sockets
  - duplicated_state
  - folio_relay_glue_loc
  - carried_patch_count

selection:
  rule: smallest-upstream-maintained-substrate-that-passes-all-required-gates
  size_alone_can_select: false
  permanent_source_fork_is_veto: true
