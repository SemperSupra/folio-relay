schema_version: 3
product: FolioRelay
experiment: print-substrate-bakeoff
autonomous: true
user_manual_steps: prohibited

sources:
  cups:
    repository: OpenPrinting/cups
    version: v2.4.19
  ippeveprinter:
    repository: OpenPrinting/cups
    version: v2.4.19
  pappl:
    repository: michaelrsweet/pappl
    version: v1.4.11

candidates:
  cups-minimal:
    hypothesis: general scheduler can be sufficiently subordinated and stripped
    permanent_fork_allowed: false
    phase0: pass
    phase1: pass
    upstream_scheduler_suite: pass
    tls: pass
    discovery_profile: pass
    least_privilege: pass
    ipp_everywhere_engineering_conformance: pass
    packaged_engineering_runtime:
      runnable: pass
      read_only_root: pass
      cap_drop_all: pass
      no_new_privileges: pass
      explicit_writable_paths: pass
    production_status: active-candidate
    authority_outage_policy:
      upstream_error_policy: retry-job
      qualification_retry_interval_seconds: 1
      qualification_retry_limit: 10
      rationale: fail closed during authority outage without permanently stopping the virtual queue

  ippeveprinter:
    hypothesis: simple upstream IPP Everywhere server is sufficient as ingress
    permanent_fork_allowed: false
    phase0: pass
    production_status: vetoed
    retained_role: interoperability-and-protocol-oracle
    veto_reasons:
      - upstream implementation explicitly accepts only one active job at a time
      - concurrent bursts return IPP server-error-busy while another job is printing
      - adding a queue or patching upstream would defeat the no-fork/minimal-substrate objective
    concurrency_observations:
      - attempts: 100
        accepted: 6
        rejected_or_failed: 94
        observed_status: server-error-busy
      - attempts: 100
        accepted: 8
        rejected_or_failed: 92
        observed_status: server-error-busy

  pappl:
    hypothesis: production-oriented IPP framework can be constrained to a narrow adapter
    permanent_fork_allowed: false
    phase0: pass
    phase1: pass
    tls: pass
    discovery_profile: pass
    least_privilege: pass
    ipp_everywhere_engineering_conformance: pass
    production_status: active-candidate
    concurrency_observations:
      - clients: 25
        requests_per_client: 100
        status: pass
        errors: 0
      - clients: 100
        requests_per_client: 100
        status: pass
        errors: 0
      - clients: 250
        requests_per_client: 100
        status: pass
        errors: 0
      - clients: 500
        requests_per_client: 20
        status: pass
        errors: 0
      - clients: 100
        requests_per_client: 1000
        status: characterization-degraded
        observed_errors:
          - 7
          - 12
        note: repeated long-run observations vary and require root-cause characterization


operating_envelope:
  interpretation:
    measured_throughput_is_characterization_not_capacity_limit: true
    passing_concurrency_is_minimum_proven_envelope_not_capacity_claim: true
    github_hosted_runner_results_are_not_production_sizing: true
  qualified_gates:
    real_print_job_concurrency:
      cups-minimal:
        concurrent_submissions: 25
        status: pass
      pappl:
        concurrent_submissions: 25
        status: pass
    pappl_minimal_external_client_pressure:
      - clients: 100
        requests_per_client: 100
        failed_clients: 0
        timed_out_clients: 0
        status: pass
      - clients: 100
        requests_per_client: 1000
        failed_clients: 0
        timed_out_clients: 0
        status: pass
    authority_outage:
      cups-minimal: pass
      pappl: pass
    cancellation_status_projection:
      cups-minimal: pass
      pappl: pass
    malformed_and_slow_client_resilience:
      cups-minimal: pass
      pappl: pass
    abusive_copy_admission:
      cups-minimal: pass
      pappl: pass
    bounded_spool_exhaustion:
      cups-minimal: pass
      pappl: pass
      fixture_bytes: 2097152
      invariant: substrate exhaustion does not advance durable accepted state or take down the state authority
    architecture_build_smoke:
      cups-minimal:
        amd64: pass
        arm64: pass
      pappl:
        amd64: pass
        arm64: pass
    tls:
      cups-minimal: pass
      pappl: pass
    dns_sd_discovery:
      cups-minimal: pass
      pappl: pass
    least_privilege:
      cups-minimal: pass
      pappl: pass
    ipp_everywhere_engineering_conformance:
      cups-minimal: pass
      pappl: pass
  hard_product_limits:
    artifact_bytes: 104857600
    copies_per_job: 1000
    state_journal_record_bytes: 4194304
    substrate_spool: deployment-bounded-separate-filesystem

flow_control:
  throttle_basis: resource-budget-and-work-pressure
  throughput_rps_limit_derived_from_ci_measurement: prohibited
  admission:
    hard_budget_exhaustion: retryable-backpressure-before-durable-accept
    permanent_policy_violation: resource-rejected
    backpressure_consumes_idempotency_key: false
    backpressure_creates_effect_intent: false
  retries:
    finite_budget_required: true
    stable_identity_preserved: true
    unbounded_retry: prohibited
  observability:
    structured_warning_events: required
    external_event_bus: optional
    warning_delivery_required_for_correctness: false
    rate_limited: true
    recommended_signals:
      - substrate_spool_utilization
      - durable_store_free_capacity
      - pending_or_active_work
      - oldest_pending_age
      - state_authority_unavailable
      - retry_budget_consumption
      - resource_rejections
      - idempotency_conflicts
      - journal_fsync_latency

veto_gates:
  - native_ipp_interoperability
  - ipp_everywhere_engineering_conformance
  - canonical_artifact_handoff
  - stable_job_effect_correlation
  - bounded_concurrency
  - bounded_input_resources
  - crash_restart_safety
  - no_duplicate_effects
  - tls
  - discovery_when_enabled
  - least_privilege
  - malformed_request_resilience
  - no_competing_durable_authority
  - amd64
  - arm64
  - upstream_security_update_path

metrics:
  - executable_bytes
  - runtime_dependency_bytes
  - dynamic_library_count
  - executable_count
  - package_count
  - cve_surface
  - startup_latency
  - idle_rss
  - loaded_rss
  - throughput
  - concurrent_clients
  - capabilities
  - writable_paths
  - listening_sockets
  - duplicated_state
  - folio_relay_glue_loc
  - carried_patch_count

selection:
  rule: smallest-upstream-maintained-substrate-that-passes-all-required-gates
  size_alone_can_select: false
  permanent_source_fork_is_veto: true
