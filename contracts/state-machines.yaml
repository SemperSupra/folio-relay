schema_version: 1
product: FolioRelay
architecture:
  durable_state_authority: single-active-writer
  actuator_mutation_model: commands-only
  transition_functions: deterministic-pure
  persistence:
    authority: append-only-checksummed-journal
    state_event_effect_commit: atomic
    effects_visible_after_commit_only: true
    fsync_before_ack: required
    snapshots_are_rebuildable_cache: true
    exclusive_active_writer: required
    active_active_first_release: prohibited
  concurrency:
    serialization_scope: aggregate
    generation_monotonic: true
    last_writer_wins: prohibited
  idempotency:
    scope: aggregate
    same_key_same_semantics: replay-original-result
    same_key_different_semantics: conflict
    generation_conflict_consumes_key: false

invariants:
  - id: INV-STATE-001
    statement: Durable product state changes only through the state authority.
  - id: INV-STATE-002
    statement: Transition functions perform no external side effects.
  - id: INV-STATE-003
    statement: State, events, and effect intents commit atomically.
  - id: INV-STATE-004
    statement: Every accepted changing transition increments generation by exactly one.
  - id: INV-STATE-005
    statement: Replayed accepted commands return their original result without repeating effects.
  - id: INV-STATE-006
    statement: Immutable artifact bytes are never overwritten.
  - id: INV-STATE-007
    statement: Required trust gates must succeed before an untrusted artifact can become ready.
  - id: INV-STATE-008
    statement: delivery_unknown cannot automatically transition to another submission attempt.
  - id: INV-STATE-009
    statement: Delivery effect creation requires an approved usable destination and qualified immutable plugin identity.
  - id: INV-STATE-010
    statement: A worker reports outcomes using result commands and cannot mutate owning aggregate state directly.
  - id: INV-STATE-011
    statement: Successful terminal effects are never automatically re-executed.
  - id: INV-STATE-012
    statement: Document content and inspector text cannot grant control-plane authority.
  - id: INV-STATE-013
    statement: Email recipients and other external-delivery targets are authorized control fields and cannot be inferred from document content.
  - id: INV-STATE-014
    statement: Failure or retry of one route leg cannot replay a different route leg that already reached a successful terminal state.
  - id: INV-STATE-015
    statement: An email-artifact effect binds immutable artifact identity, recipient identity, route-leg identity, and immutable sender plugin identity before dispatch.
  - id: INV-STATE-016
    statement: Retryable admission backpressure cannot consume an idempotency key, advance generation, or create an effect intent.
  - id: INV-STATE-017
    statement: New work cannot be durably accepted when any required hard resource budget is exhausted.
  - id: INV-STATE-018
    statement: Automatic retries have an explicit finite attempt or time budget and preserve stable command identity.
  - id: INV-STATE-019
    statement: Substrate spool and queue state are bounded disposable projection state and cannot consume the state journal's reserved capacity.
  - id: INV-STATE-020
    statement: Operational warning delivery is advisory and cannot be required for correctness or durable state safety.

machines:
  route_leg:
    initial: pending
    terminal: [delivered, cancelled]
    states:
      pending: [preparing, cancelled]
      preparing: [ready, blocked, failed, cancelled]
      ready: [dispatching, blocked, cancelled]
      dispatching: [delivered, failed, delivery_unknown, blocked]
      failed: [pending, cancelled]
      blocked: [pending, cancelled]
      delivery_unknown: [delivered, failed]
      delivered: []
      cancelled: []
    guards:
      failed_to_pending: explicit_retry_policy
      blocked_to_pending: blocker_resolved
      delivery_unknown_to_failed: reconciliation_evidence_or_manual_resolution
      delivery_unknown_to_delivered: reconciliation_evidence
      delivery_unknown_to_pending: prohibited

  effect:
    initial: pending
    states:
      pending: [leased, cancelled]
      leased: [executing, pending, cancelled]
      executing: [succeeded, failed, unknown]
      failed: [pending, cancelled]
      unknown: [succeeded, failed]
      succeeded: []
      cancelled: []
    guards:
      leased_to_pending: lease_expired_before_external_submission
      failed_to_pending: explicit_retry_policy
      unknown_to_pending: prohibited
      unknown_resolution: reconciliation_evidence_or_manual_resolution

  destination:
    initial: discovered
    states:
      discovered: [observed, revoked]
      observed: [approved, revoked]
      approved: [active, disabled, revoked]
      active: [drifted, disabled, revoked]
      drifted: [approved, disabled, revoked]
      disabled: [approved, revoked]
      revoked: []
    guards:
      active_required_for_delivery_effect: true

  plugin:
    initial: candidate
    states:
      candidate: [qualifying, rejected]
      qualifying: [qualified, rejected]
      qualified: [active, quarantined, revoked]
      active: [quarantined, revoked]
      quarantined: [qualifying, revoked]
      rejected: []
      revoked: []
    guards:
      active_requires_qualified_immutable_digest: true

  artifact:
    initial: quarantined
    states:
      quarantined: [inspecting, render_pending, policy_rejected, malformed, resource_rejected]
      inspecting: [render_pending, policy_rejected, malformed, resource_rejected, quarantined]
      render_pending: [rendering, policy_rejected, resource_rejected]
      rendering: [validating, malformed, resource_rejected, quarantined]
      validating: [ready, malformed, policy_rejected, quarantined]
      ready: []
      policy_rejected: []
      malformed: []
      resource_rejected: []
    guards:
      untrusted_to_ready_requires_all_policy_gates: true
      transforms_create_new_artifact_identity: true

  job:
    initial: submitted
    states:
      submitted: [admitted, policy_rejected, resource_rejected, malformed, cancelled]
      admitted: [active, cancelled]
      active: [completed, partially_completed, failed, cancelled]
      completed: []
      partially_completed: []
      failed: []
      policy_rejected: []
      resource_rejected: []
      malformed: []
      cancelled: []
    guards:
      terminal_status_should_be_derived_from_route_legs: true

  inspector:
    initial: requested
    states:
      requested: [running, cancelled]
      running: [clean, malicious, suspicious, unknown, error, timeout, cancelled]
      clean: []
      malicious: []
      suspicious: []
      unknown: []
      error: []
      timeout: []
      cancelled: []
    guards:
      inspector_result_cannot_directly_promote_artifact: true
      inspector_result_cannot_change_route_authority: true

  resource_admission:
    initial: normal
    states:
      normal: [pressure, saturated]
      pressure: [normal, saturated]
      saturated: [recovering]
      recovering: [normal, pressure, saturated]
    guards:
      accepts_allowed_only_when_hard_budgets_available: true
      pressure_may_reduce_worker_concurrency: true
      saturated_new_work_disposition: retryable_backpressure_before_durable_accept
      retryable_backpressure_consumes_idempotency_key: false
      retryable_backpressure_creates_effect_intent: false
      automatic_retry_requires_finite_budget: true
      thresholds_are_deployment_configured: true
      recovery_requires_hysteresis: true
      warnings_are_rate_limited_and_advisory: true

  state_authority:
    initial: starting
    states:
      starting: [recovering, safe_stop]
      recovering: [active, read_only, safe_stop]
      active: [draining, read_only, safe_stop]
      draining: [stopped, read_only, safe_stop]
      read_only: [recovering, draining, safe_stop]
      safe_stop: [recovering, stopped]
      stopped: []
    guards:
      active_requires:
        - exclusive_writer_lease
        - journal_integrity_verified
        - supported_schema_version
        - persistent_store_writable_and_fsynced
      mutating_commands_allowed_only_in: [active]
      read_only_queries_allowed_in: [active, draining, read_only]
      invariant_violation_enters: safe_stop
      journal_corruption_beyond_recoverable_tail_enters: safe_stop
      storage_write_or_fsync_failure_enters: read_only
