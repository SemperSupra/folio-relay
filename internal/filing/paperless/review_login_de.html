<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dokumentenprüfung – Anmeldung</title><script src="/filing/review-login.js" defer></script></head>
<body><main><h1>Anmeldung zur Dokumentenprüfung</h1><p>Der Zugang gilt nur für einen Datensatz und erlaubt keine Änderungen in Paperless-ngx.</p>
<form data-review-form autocomplete="off" method="post"><p><label for="effect">Kennung des Ablagedatensatzes</label><input id="effect" name="effect" type="text" minlength="64" maxlength="64" spellcheck="false" autocomplete="off" required></p>
<p><label for="grant">Zugangsberechtigung für diesen Datensatz</label><input id="grant" name="grant" type="password" autocomplete="off" spellcheck="false" required></p>
<p><button type="submit">Schreibgeschützte Prüfung öffnen</button></p></form><p role="status" aria-live="polite" data-status></p>
<p>Hierfür ist eine separat ausgestellte Berechtigung erforderlich. Das FolioRelay-Verwaltungstoken wird nicht akzeptiert.</p></main></body></html>
