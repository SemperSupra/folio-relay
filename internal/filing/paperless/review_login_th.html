<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าสู่ระบบเพื่อตรวจสอบเอกสาร</title><script src="/filing/review-login.js" defer></script></head>
<body><main><h1>เข้าสู่ระบบเพื่อตรวจสอบเอกสาร</h1><p>สิทธิ์นี้ใช้ดูข้อมูลเอกสารเพียงรายการเดียว ไม่สามารถแก้ไขข้อมูลใน Paperless-ngx ได้</p>
<form data-review-form autocomplete="off" method="post"><p><label for="effect">รหัสรายการเอกสาร</label><input id="effect" name="effect" type="text" minlength="64" maxlength="64" spellcheck="false" autocomplete="off" required></p>
<p><label for="grant">รหัสสิทธิ์การตรวจสอบเอกสารรายการนี้</label><input id="grant" name="grant" type="password" autocomplete="off" spellcheck="false" required></p>
<p><button type="submit">เปิดหน้าตรวจสอบแบบอ่านอย่างเดียว</button></p></form><p role="status" aria-live="polite" data-status></p>
<p>ต้องใช้รหัสสิทธิ์ที่ออกให้แยกต่างหาก ไม่สามารถใช้รหัสผู้ดูแลระบบ FolioRelay ได้</p></main></body></html>
